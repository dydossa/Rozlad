<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rozkład 3I3</title>
<meta name="theme-color" id="themeColor" content="#5fbcf5">
<script>
/* Pick the look before anything is drawn: neutral on the sign-in screen,
   otherwise the user's saved choice, or the device setting if they never chose. */
(function(){
  var saved=null, signedIn=false;
  try{ saved=localStorage.getItem('rz.theme');
       for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(/^sb-.*-auth-token$/.test(k)) signedIn=true } }catch(e){}
  var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var t=signedIn?((saved==='light'||saved==='dark')?saved:sys):'neutral';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeColor').setAttribute('content',t==='dark'?'#131210':t==='light'?'#ffffff':'#ececee');
})();
</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rozkład">
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky toolbar with zjazd numbers. Wide screens get a horizontal timetable like the university PDF (one row per day, time left to right). Phones get two swipe pages, Sobota and Niedziela, with one card per class and a quick field for homework. Sheets slide up on phones and in from the right on desktop. */
:root{
  /* light: calm and soft */
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#1e2531; --ink-2:#5c6676; --line:#e1e6ed;
  --accent:#3d6fd9; --accent-ink:#ffffff; --danger:#c8372d; --scrim:rgba(20,28,40,.35);
  --top:rgba(255,255,255,.88); --glow:none; --card-shadow:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.05);
  --wyk-bg:#fff4cf; --wyk-bd:#d9a520;
  --lab-bg:#e1edff; --lab-bd:#4a82dd;
  --proj-bg:#ffe3df; --proj-bd:#de5c48;
  --lek-bg:#def3df; --lek-bd:#46a052;
  --cw-bg:#ede4fb; --cw-bd:#8b66c6;
  --inne-bg:#eef0f3; --inne-bd:#8d97a6; --band:#f8fafc;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-c:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  /* dark: the forge after hours — soot and cast iron, lit by one piece of steel at about 1000 °C.
     Lesson types use steel temper colours (straw, bronze, violet, blue), so they belong to the same material. */
  --bg:#100e0d; --surface:#181513; --surface-2:#211d1a; --ink:#ffe3c6; --ink-2:#b39077; --line:#2d2723;
  --accent:#ff9b45; --accent-hot:#ffc78e; --accent-ink:#2a1300; --danger:#ff7a5c; --scrim:rgba(5,4,3,.72);
  --top:rgba(19,18,16,.9); --glow:0 0 0 1px rgba(255,165,82,.35),0 6px 24px rgba(255,140,50,.10); --card-shadow:none;
  --molten:linear-gradient(90deg,rgba(255,120,30,0) 0%,#ff7a1e 20%,#ffa552 38%,#ffe2b8 50%,#ffa552 62%,#ff7a1e 80%,rgba(255,120,30,0) 100%);
  --wyk-bd:#ff9b45; --wyk-bg:#2a1c12;
  --lab-bd:#4fd6a4; --lab-bg:#132520;
  --proj-bd:#ff7092; --proj-bg:#2b161c;
  --lek-bd:#f2d45c; --lek-bg:#272313;
  --cw-bd:#ad8cff; --cw-bg:#1f1a2c;
  --inne-bd:#9d948c; --inne-bg:#201d1b; --band:#141110;
  color-scheme:dark;
}
:root[data-theme="neutral"]{
  /* sign-in screen: one neutral look for everybody */
  --bg:#ececee; --surface:#ffffff; --surface-2:#f4f4f6; --ink:#1f1f23; --ink-2:#64646c; --line:#dcdce0;
  --accent:#2f2f36; --accent-ink:#ffffff; --danger:#c0392b; --top:#ffffff; --glow:none; --card-shadow:0 6px 30px rgba(0,0,0,.08);
}
*{box-sizing:border-box}
/* ---------- dark theme details ---------- */
.scene{position:fixed;inset:0;z-index:-1;pointer-events:none;display:none}
:root[data-theme="dark"] .scene{display:block;background:
  radial-gradient(90% 50% at 50% 115%,rgba(255,140,50,.10),rgba(255,140,50,0) 70%),
  radial-gradient(60% 40% at 0% 0%,rgba(255,170,90,.035),rgba(255,170,90,0) 70%)}
/* the one moving thing: a seam of molten metal under the toolbar, flowing slowly and evenly */
:root[data-theme="dark"] .top{border-bottom:1px solid var(--line);box-shadow:none}
:root[data-theme="dark"] .top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:2px;background:var(--molten);background-size:250% 100%;opacity:.9;filter:drop-shadow(0 0 6px rgba(255,150,60,.55));animation:flow 14s linear infinite}
@keyframes flow{from{background-position:125% 0}to{background-position:-125% 0}}
@media (prefers-reduced-motion:reduce){:root[data-theme="dark"] .top::after{animation:none;background-position:50% 0}}
/* zjazd chips: the chosen one is a glowing ingot */
:root[data-theme="dark"] .chip{background:transparent;border-color:var(--line);color:var(--ink-2)}
:root[data-theme="dark"] .chip:hover{border-color:#4a433c;color:var(--ink)}
:root[data-theme="dark"] .chip[aria-selected="true"]{background:linear-gradient(180deg,var(--accent-hot),var(--accent) 55%,#f08a3a);color:var(--accent-ink);border-color:transparent;box-shadow:0 0 0 1px rgba(255,190,120,.35),0 4px 18px rgba(255,150,60,.28)}
:root[data-theme="dark"] .chip.has::after{background:var(--accent)}
:root[data-theme="dark"] .chip[aria-selected="true"].has::after{background:var(--accent-ink)}
/* lessons: iron plates with a thin temper-coloured edge and a faint warmth of the same hue */
:root[data-theme="dark"] .blk{background:var(--k-bg);background:linear-gradient(160deg,color-mix(in srgb,var(--k-bd) 14%,var(--surface)),color-mix(in srgb,var(--k-bd) 4%,var(--surface)) 80%);border:1px solid color-mix(in srgb,var(--k-bd) 22%,var(--line));border-left:3px solid var(--k-bd);transition:border-color .15s,box-shadow .2s}
:root[data-theme="dark"] .blk:hover{border-color:color-mix(in srgb,var(--k-bd) 45%,var(--line));border-left-color:var(--k-bd);box-shadow:0 0 0 1px color-mix(in srgb,var(--k-bd) 25%,transparent),0 10px 30px color-mix(in srgb,var(--k-bd) 14%,transparent);filter:none}
:root[data-theme="dark"] .blk .te{color:var(--ink-2)}
:root[data-theme="dark"] .blk .kind{color:var(--k-bd);opacity:.95}
:root[data-theme="dark"] .blk .rm{color:var(--ink)}
:root[data-theme="dark"] .blk .hw{background:var(--accent);color:var(--accent-ink)}
:root[data-theme="dark"] .card{border:1px solid color-mix(in srgb,var(--k-bd) 22%,var(--line));border-left:3px solid var(--k-bd)}
:root[data-theme="dark"] .card .chead{background:var(--k-bg);background:linear-gradient(160deg,color-mix(in srgb,var(--k-bd) 14%,var(--surface)),color-mix(in srgb,var(--k-bd) 4%,var(--surface)))}
:root[data-theme="dark"] .card .ckind{color:var(--k-bd)}
:root[data-theme="dark"] .ctask i{background:var(--k-bd)}
:root[data-theme="dark"] .gap{border-color:var(--line);background:transparent;-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-theme="dark"] .sched{background:var(--surface);border-color:var(--line)}
:root[data-theme="dark"] .hcell{color:var(--ink-2)}
:root[data-theme="dark"] .dlabel{color:var(--ink-2)}
:root[data-theme="dark"] .legend i{background:var(--k-bd);border-color:var(--k-bd);border-radius:50%;width:8px;height:8px;vertical-align:1px}
:root[data-theme="dark"] .daytab[aria-selected="true"]{border-bottom-color:var(--accent);color:var(--ink)}
:root[data-theme="dark"] .badge{background:var(--accent);color:var(--accent-ink)}
:root[data-theme="dark"] .btn{background:var(--surface);border-color:var(--line)}
:root[data-theme="dark"] .btn:hover,:root[data-theme="dark"] .icon:hover{background:var(--surface-2);border-color:#4a433c}
:root[data-theme="dark"] .icon{background:var(--surface);border-color:var(--line)}
:root[data-theme="dark"] .btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
:root[data-theme="dark"] .btn.primary:hover{background:var(--accent-hot);border-color:var(--accent-hot)}
:root[data-theme="dark"] .btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
:root[data-theme="dark"] .mi{background:rgba(255,165,82,.12);color:var(--accent)}
:root[data-theme="dark"] .avatar{background:linear-gradient(180deg,var(--accent-hot),var(--accent));color:var(--accent-ink)}
:root[data-theme="dark"] :focus-visible{outline-color:var(--accent)}
:root[data-theme="dark"] .sheet{background:var(--surface);border-color:var(--line)}
.top{background:var(--top)!important;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.sched,.card,.empty,.login,.gap{box-shadow:var(--card-shadow)}
.gap{background-color:color-mix(in srgb,var(--surface) 72%,transparent)}
.blk:hover,.card:hover{box-shadow:var(--glow),var(--card-shadow)}

[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* toolbar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:10px;padding-block:10px 6px;flex-wrap:wrap}
.termpick{flex:1 1 160px;min-width:0}
.termpick select{width:100%;font-size:19px;font-weight:600;letter-spacing:-.01em;background:transparent;border:0;padding:4px 0;text-overflow:ellipsis;cursor:pointer}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.icon:hover{background:var(--surface-2)}
.icon svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-family:var(--mono)}
.weeks{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-right:2px;flex:none}
.chip{position:relative;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:15px;font-weight:500;min-width:44px;height:38px;text-align:center}
.chip[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.has::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip[aria-selected="true"].has::after{background:var(--surface)}
.daytabs{display:none;gap:0;border-top:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.daytab{flex:1;border:0;background:transparent;padding:11px 8px 10px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;display:flex;justify-content:center;gap:8px;align-items:center}
.daytab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* wide screens: horizontal timetable, six equal columns of two hours */
main{padding-top:18px}
.hint{background:var(--surface);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-2);display:grid;gap:8px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;min-height:36px}
.sched{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;overscroll-behavior-x:contain}
.tl{min-width:calc(46px + var(--n) * 184px)}
.hrow,.drow{display:flex}
.dcorner,.dlabel{position:sticky;left:0;z-index:4;width:46px;flex:none;background:var(--surface);border-right:1px solid var(--line)}
.hrow{border-bottom:1px solid var(--line)}
.haxis{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.hcell{padding:11px 0;text-align:center;font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;color:var(--ink-2);border-left:1px solid var(--line)}
.hcell:first-child{border-left:0}
.drow+.drow{border-top:1px solid var(--line)}
.dlabel{display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.dlabel span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.dtrack{position:relative;flex:1;min-width:0;background-image:linear-gradient(90deg,var(--band) 50%,transparent 50%),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(200% / var(--n)) 100%,calc(100% / var(--n)) 100%}
.editing .dtrack{cursor:copy}
.dtrack .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:13px;pointer-events:none}
.blk{position:absolute;border-radius:10px;padding:9px 11px 9px 13px;overflow:hidden;background:var(--k-bg);border:1px solid var(--k-bd);border-left-width:5px;font-size:13px;line-height:1.25;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;user-select:none;-webkit-user-select:none;transition:filter .12s,box-shadow .12s}
.blk:hover{filter:brightness(.97);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.k-wyk{--k-bg:var(--wyk-bg);--k-bd:var(--wyk-bd)}
.k-lab{--k-bg:var(--lab-bg);--k-bd:var(--lab-bd)}
.k-proj{--k-bg:var(--proj-bg);--k-bd:var(--proj-bd)}
.k-lek{--k-bg:var(--lek-bg);--k-bd:var(--lek-bd)}
.k-cw{--k-bg:var(--cw-bg);--k-bd:var(--cw-bd)}
.k-inne{--k-bg:var(--inne-bg);--k-bd:var(--inne-bd)}
.blk .kind{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);min-height:16px}
.blk .nm{flex:0 0 auto;font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.blk .rm{flex:0 0 auto;font-family:var(--mono);font-size:12px;font-weight:500}
.blk .te{font-size:11.5px;color:var(--ink-2);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .hw{background:var(--ink);color:var(--surface);border-radius:99px;font-family:var(--mono);font-size:10.5px;padding:0 6px;line-height:16px;letter-spacing:0}
.editing .blk{touch-action:none;cursor:grab;outline:1px dashed var(--ink-2);outline-offset:-1px}
.blk.drag{cursor:grabbing;z-index:5;box-shadow:0 8px 22px rgba(0,0,0,.28);transition:none}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{margin:0;font-size:20px}
.empty p{margin:0;color:var(--ink-2);max-width:46ch}
.skeleton{height:320px;border-radius:10px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.sheet,.scrim{transition:none!important}.pages{scroll-behavior:auto!important}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--k-bg);border:1px solid var(--k-bd)}

/* phones: two pages, one card per class */
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;gap:12px;align-content:start;min-width:0;padding-bottom:24px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--k-bd);border-radius:12px;overflow:hidden;min-width:0;padding:0;cursor:pointer}
.card:active{filter:brightness(.97)}
.chead{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--k-bg);padding:12px 14px}
.gap{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-2);background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 35%,transparent) 8px 9px)}
.gap .gtime{font-family:var(--mono);font-size:13px;white-space:nowrap}
.gap .gtxt{font-size:14px}
.gap .gtxt b{display:block;font-weight:600;color:var(--ink);font-size:16px}
.ctime{font-family:var(--mono);font-size:13px;line-height:1.35;color:var(--ink-2)}
.ctime b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.cmain{min-width:0}
.ckind{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.cname{font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.cmeta{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.cfiles{font-family:var(--mono);font-size:11px;color:var(--ink-2);border:1px solid var(--k-bd);border-radius:99px;padding:1px 8px;white-space:nowrap}
.ctasks{padding:8px 14px 12px;display:grid;gap:4px}
.ctask{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start;font-size:15px}
.ctask i{width:7px;height:7px;border-radius:50%;background:var(--k-bd);margin-top:8px}
.ctask span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card,.gap{height:172px;box-sizing:border-box}
.card{display:flex;flex-direction:column}
.card .chead{flex:0 0 auto}
.card .ctasks{flex:1 1 auto;min-height:0;overflow:hidden}
.card .cname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cmeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdone{font-size:12px;color:var(--ink-2)}
.cnone{font-size:13px;color:var(--ink-2)}
@media (max-width:820px){
  #btnEdit{display:none}
  .daytabs{display:flex}
  .row1{padding-block:8px 2px}
  .termpick select{font-size:17px}
  .btn .lbl{display:none}
  main{padding-top:12px}
  input,textarea,select{font-size:16px}
}

/* sheets */
.layer{position:fixed;inset:0;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .22s ease;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.layer.open{pointer-events:auto}
.layer.open .scrim{opacity:1}

<body>
<div class="scene" aria-hidden="true"></div>
<header class="top"><div class="wrap">
  <div class="row1">
    <label class="termpick"><span class="sr">Rozkład</span><select id="termSel"></select></label>
    <div class="tools">
      <button class="btn" id="btnSubjects" type="button" aria-label="Przedmioty i zadania tego zjazdu">
        <svg viewBox="0 0 24 24"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3z"/><path d="M9 9h6M9 13h6"/></svg>
        <span class="lbl">Zadania</span><span class="badge" id="hwBadge" hidden></span>
      </button>
      <button class="btn" id="btnEdit" type="button" aria-pressed="false">

      </button>

  </div>

</div></header>
<main class="wrap" id="app"><div class="skeleton" aria-label="Ładowanie rozkładu"></div></main>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* Stored day keys stay as saved in the database; DAYPL is only for display. */
var WEEKDAYS=['Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота','Неділя'];
var DAYPL={'Понеділок':'Poniedziałek','Вівторок':'Wtorek','Середа':'Środa','Четвер':'Czwartek','Пʼятниця':'Piątek','Субота':'Sobota','Неділя':'Niedziela'};
function dayName(d){return DAYPL[d]||d}
var KINDS=['Wykład','Laboratorium','Projekt','Lektorat','Ćwiczenia','Inne'];
var KCLS={'Wykład':'wyk','Laboratorium':'lab','Projekt':'proj','Lektorat':'lek','Ćwiczenia':'cw','Inne':'inne'};
var COL=120, BH=134, GAP=6; /* every class is two hours, from a full hour to a full hour */
var S={terms:[],subjects:[],slots:[],homework:[],files:[],members:[],termId:null,week:1,page:0,edit:false,ready:false,user:null,role:null};
var SB=null, dragging=false, pendingRender=false, open={id:null,week:null,kind:null};
function isOwner(){return S.role==='owner'}
function canEdit(x){return isOwner()||(S.user&&x.author===S.user.id)}
function authorName(x){
  if(S.user&&x.author===S.user.id) return 'Ty';
  var m=S.members.find(function(m){return m.email===x.authorEmail});
  return (m&&m.name)||(x.authorEmail||'').split('@')[0]||'?';
}
var mq=window.matchMedia?window.matchMedia('(max-width:820px)'):{matches:false};
function isPhone(){return !!mq.matches}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function h(tag,props){
  var e=document.createElement(tag), p=props||{};
  Object.keys(p).forEach(function(k){
    var v=p[k]; if(v==null||v===false) return;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='value'||k==='checked'||k==='disabled') e[k]=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){ add(e,arguments[i]); }
  return e;
}
function add(e,c){ if(c==null||c===false) return; if(Array.isArray(c)) c.forEach(function(x){add(e,x)}); else e.append(c.nodeType?c:document.createTextNode(String(c))); }
function cl(x){return JSON.parse(JSON.stringify(x))}
function uid(){ try{return crypto.randomUUID().replace(/-/g,'').slice(0,10)}catch(e){return Math.random().toString(36).slice(2,12)} }
function pad(n){return (n<10?'0':'')+n}
function fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function parseT(s){var m=/^(\d{1,2}):(\d{2})/.exec(s||''); return m?(+m[1])*60+(+m[2]):null}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function icon(name){
  var P={x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.innerHTML=P[name]; return s;
}
var toastT;
function toast(msg){var t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on')},3200)}
function parseWeeks(str){
  if(!str||!String(str).trim()) return [];
  var set={}, parts=String(str).split(/[,;\s]+/);
  for(var i=0;i<parts.length;i++){
    if(!parts[i]) continue;
    var m=/^(\d+)(?:[-–](\d+))?$/.exec(parts[i]); if(!m) return null;
    var a=+m[1], b=m[2]?+m[2]:a; if(b<a||a<1||b>60) return null;
    for(var k=a;k<=b;k++) set[k]=1;
  }
  return Object.keys(set).map(Number);
}
function curTerm(){return S.terms.find(function(t){return t.id===S.termId})||null}
function subj(id){return S.subjects.find(function(s){return s.id===id})||null}
function weekSlots(w){return S.slots.filter(function(s){return s.termId===S.termId&&s.week===w})}
function termSlots(){return S.slots.filter(function(s){return s.termId===S.termId})}
/* Homework and files belong to one subject AND one kind of class: a lecture and a lab of the same subject are separate.
   Old entries without a kind go to the lecture of that zjazd (or to the first kind the subject has there). */
function defaultKind(week,sid){
  var ks=weekSlots(week).filter(function(z){return z.subjectId===sid}).map(function(z){return z.kind});
  return ks.indexOf('Wykład')>=0?'Wykład':(ks[0]||'Wykład');
}
function inNote(week,sid,kind){
  var dk=null;
  return function(x){
    if(x.termId!==S.termId||x.week!==week||x.subjectId!==sid) return false;
    var k=x.kind; if(!k){ if(dk===null) dk=defaultKind(week,sid); k=dk }
    return k===kind;
  };
}
function getNote(week,sid,kind){
  return {homework:S.homework.filter(inNote(week,sid,kind)),files:S.files.filter(inNote(week,sid,kind))};
}
function openHw(week){
  return S.homework.filter(function(x){return x.termId===S.termId&&x.week===week&&!x.done}).length;
}
function openHwDay(week,day){
  var ids={}; weekSlots(week).forEach(function(z){if(z.day===day) ids[z.subjectId+'\u0001'+z.kind]=z});
  return Object.keys(ids).reduce(function(n,k){var z=ids[k]; return n+getNote(week,z.subjectId,z.kind).homework.filter(function(y){return !y.done}).length},0);
}

/* ---------- database (Supabase) ---------- */
/* App objects use camelCase; table columns use snake_case. */
var COLS={termId:'term_id',subjectId:'subject_id',weekCount:'week_count',createdAt:'created_at',start:'start_min',end:'end_min',authorEmail:'author_email'};
var PROPS={}; Object.keys(COLS).forEach(function(k){PROPS[COLS[k]]=k});
function toRow(o){var r={}; Object.keys(o).forEach(function(k){r[COLS[k]||k]=o[k]}); return r}
function fromRow(r){var o={}; Object.keys(r).forEach(function(k){o[PROPS[k]||k]=r[k]}); return o}
function applyLocal(table,id,obj){
  var list=S[table]; if(!list) return;
  var i=list.findIndex(function(x){return x.id===id});
  if(obj===null){ if(i>=0) list.splice(i,1); }
  else if(i>=0) list[i]=obj; else list.push(obj);
}
/* write('table/id', data, 'set'|'insert'|'update'|'delete') — writes, then mirrors the saved row locally */
var queues={};
function write(path,data,mode){
  if(!SB){toast('Brak połączenia z bazą'); return Promise.resolve(false)}
  var parts=path.split('/'), table=parts[0], id=parts[1];
  var prev=queues[path]||Promise.resolve();
  var p=prev.catch(function(){}).then(function(){
    var q=SB.from(table), row=data?toRow(data):null;
    if(row) row.id=id;
    if(mode==='delete') q=q.delete().eq('id',id);
    else if(mode==='update'){ delete row.id; q=q.update(row).eq('id',id); }
    else if(mode==='insert') q=q.insert(row);
    else q=q.upsert(row);
    return q.select();
  }).then(function(res){
    if(res.error) throw res.error;
    if(!res.data||!res.data.length) throw {code:'denied'};
    applyLocal(table,id,mode==='delete'?null:fromRow(res.data[0]));
    if(table==='terms') ensureTerm();
    scheduleRender(); return true;
  }).catch(function(e){
    console.error(e);
    toast(e&&e.code==='denied'||e&&e.code==='42501'?'Nie masz uprawnień do tej zmiany':'Nie udało się zapisać. Sprawdź internet i spróbuj ponownie');
    return false;
  });
  queues[path]=p; return p;
}
/* load everything the signed-in member may see */
var loading=null;
function load(){
  if(loading) return loading;
  function all(t,order){return SB.from(t).select('*').order(order||'id').range(0,9999)}
  loading=Promise.all([all('terms','created_at'),all('subjects','created_at'),all('slots'),all('homework','created_at'),all('files','created_at'),all('members','added_at')])
  .then(function(r){
    var bad=r.find(function(x){return x.error}); if(bad) throw bad.error;
    ['terms','subjects','slots','homework','files','members'].forEach(function(t,i){S[t]=r[i].data.map(fromRow)});
    ensureTerm(); S.ready=true; scheduleRender();
  }).catch(function(e){ console.error(e); if(!S.ready) fail('Nie udało się wczytać danych'); else toast('Nie udało się odświeżyć danych'); })
  .then(function(){loading=null});
  return loading;
}
/* private files are shown through short-lived signed links */
var URLC={};
function signedUrls(paths){
  var now=Date.now(), need=paths.filter(function(p){return !URLC[p]||URLC[p].exp<now});
  if(!need.length) return Promise.resolve();
  return SB.storage.from('files').createSignedUrls(need,3600).then(function(res){
    (res.data||[]).forEach(function(x){ if(x.signedUrl) URLC[x.path]={url:x.signedUrl,exp:now+50*60*1000} });
  });
}
function removeStored(paths){
  if(!paths.length) return Promise.resolve();
  return SB.storage.from('files').remove(paths).then(function(r){ if(r.error) console.error(r.error) });
}

/* ---------- sheets ---------- */
function makeSheet(z){
  var layer=h('div',{class:'layer',style:'z-index:'+z}), scrim=h('div',{class:'scrim'}), sheet=h('div',{class:'sheet',role:'dialog','aria-modal':'true'});
  layer.append(scrim,sheet); document.body.append(layer);
  var api={layer:layer,sheet:sheet,onClose:null,
    open:function(){layer.classList.add('open')},
    close:function(){ if(!layer.classList.contains('open')) return; layer.classList.remove('open'); if(api.onClose) api.onClose(); },
    isOpen:function(){return layer.classList.contains('open')}};
  scrim.addEventListener('click',api.close);

function block(s,lane,gs,T){

function startDrag(e,b,s){
  var ctx=$('#sched')._ctx, gs=ctx.gs, ge=ctx.ge, T=ctx.T, days=ctx.days, scroller=ctx.scroller;
  var rects=ctx.rowEls.map(function(r){return r.getBoundingClientRect()}), ppm=rects[0].width/T;

function guessType(f){
  var t=(f.type||'').toLowerCase(), n=f.name.toLowerCase();
  var ok=['image/png','image/jpeg','image/gif','image/webp','image/svg+xml','application/pdf','text/plain','text/markdown','text/csv','application/json','video/mp4','video/webm'];
  if(ok.indexOf(t)>=0) return t;
  if(t==='image/jpg') return 'image/jpeg';
  if(/\.(jpe?g)$/.test(n)) return 'image/jpeg';
  if(/\.png$/.test(n)) return 'image/png';
  if(/\.webp$/.test(n)) return 'image/webp';
  if(/\.pdf$/.test(n)) return 'application/pdf';
  if(/\.txt$/.test(n)) return 'text/plain';
  if(/\.md$/.test(n)) return 'text/markdown';
  if(/\.csv$/.test(n)) return 'text/csv';
  return null;
}

      var cur=curTerm(); accountSheet.close();
      var paths=S.files.filter(function(f){return f.termId===cur.id}).map(function(f){return f.path});
      removeStored(paths).then(function(){return write('terms/'+cur.id,null,'delete')}).then(function(ok){ if(ok) load() });
    });
    out.push(group('Strefa niebezpieczna',[delBtn]));
  }
  accountSheet.sheet.replaceChildren.apply(accountSheet.sheet,[sheetHead('Ustawienia',accountSheet)].concat(out.flat()).filter(Boolean));
  accountSheet.open();
}

/* ---------- change password (signed in) ---------- */
function passwordChanger(){
  var NO={autocapitalize:'none',autocorrect:'off',spellcheck:'false',autocomplete:'new-password'};
  var pw=h('input',Object.assign({type:'password',placeholder:'Nowe hasło','aria-label':'Nowe hasło'},NO));
  var pw2=h('input',Object.assign({type:'password',placeholder:'Powtórz nowe hasło','aria-label':'Powtórz nowe hasło'},NO));
  var eye=h('button',{class:'eye',type:'button','aria-label':'Pokaż hasło','aria-pressed':'false',title:'Pokaż hasło'},eyeIcon(false));
  eye.addEventListener('click',function(){
    var show=pw.type==='password'; pw.type=pw2.type=show?'text':'password';
    eye.setAttribute('aria-pressed',String(show)); var t=show?'Ukryj hasło':'Pokaż hasło'; eye.setAttribute('aria-label',t); eye.title=t; eye.replaceChildren(eyeIcon(show));
  });
  var msg=h('div',{class:'msg',role:'status'});
  var go=h('button',{class:'btn primary',type:'submit'},'Zapisz nowe hasło');
  var form=h('form',{class:'pwform'},h('div',{class:'pwrow'},pw,eye),h('div',{class:'pwrow'},pw2),
    h('div',{class:'rule',text:'Minimum '+PW_MIN+' znaków — litery łacińskie, cyfry, spacje i znaki specjalne.'}),
    h('div',{class:'actions'},go),msg);
  form.addEventListener('submit',async function(ev){
    ev.preventDefault(); msg.className='msg'; msg.textContent='';
    var bad=pwProblem(pw.value,pw2.value); if(bad){ msg.className='msg bad'; msg.textContent=bad; return }
    go.disabled=true;
    var r=await SB.auth.updateUser({password:pw.value});
    go.disabled=false;
    if(r.error){ msg.className='msg bad'; msg.textContent=authMsg(r.error); return }
    pw.value=pw2.value=''; msg.textContent='Hasło zmienione. Następnym razem zaloguj się nowym hasłem.'; toast('Hasło zmienione');
  });
  return form;
}

/* ---------- sign in ---------- */
var AUTHERR={'Invalid login credentials':'Zły e-mail lub hasło.','Email not confirmed':'Najpierw potwierdź e-mail — kliknij link w wiadomości, którą dostałeś(-aś).','User already registered':'To konto już istnieje — zaloguj się.','New password should be different from the old password.':'Nowe hasło musi być inne niż obecne.'};
function authMsg(e){
  var m=e&&e.message||'', n=/at least (\d+)/i.exec(m);
  return AUTHERR[m]||(/rate limit/i.test(m)?'Za dużo prób. Poczekaj chwilę.':/Password should be/i.test(m)?'Hasło musi mieć co najmniej '+(n?n[1]:'6')+' znaków (ten limit ustawia Supabase).':'Coś poszło nie tak: '+m);
}
var PW_MIN=6, PW_OK=/^[\x20-\x7E]+$/; /* Latin letters, digits, symbols and spaces; no Polish/Ukrainian letters */
var lastEmail=''; try{lastEmail=localStorage.getItem('rz.email')||''}catch(e){}
function rememberEmail(v){ lastEmail=v; try{ if(v) localStorage.setItem('rz.email',v) }catch(e){} }
function pwProblem(p,p2){
  if(p.length<PW_MIN) return 'Hasło musi mieć co najmniej '+PW_MIN+' znaków.';
  if(!PW_OK.test(p)) return 'Hasło może zawierać tylko litery łacińskie (bez polskich znaków), cyfry, spacje i znaki specjalne.';
  if(p!==p2) return 'Hasła nie są takie same.';
  return '';
}
function eyeIcon(off){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24');
  s.innerHTML=off?'<path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c5 0 8.5 4.2 9.5 6-.4.8-1.3 2.1-2.6 3.3M6.6 7.7C4.6 9.1 3.3 10.9 2.5 12c1 1.8 4.5 6 9.5 6 1.5 0 2.8-.4 4-.9"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/>':'<path d="M2.5 12C3.5 10.2 7 6 12 6s8.5 4.2 9.5 6c-1 1.8-4.5 6-9.5 6s-8.5-4.2-9.5-6z"/><circle cx="12" cy="12" r="3"/>';
  return s;
}
function showLogin(mode){
  mode=mode||'in';
  document.body.classList.add('auth'); applyTheme(); S.ready=false; S.user=null; S.role=null;
  [accountSheet,settingsSheet,editorSheet,subjectSheet,subjectsSheet].forEach(function(s){s.close()});
  var em=h('input',{type:'email',placeholder:'E-mail',autocomplete:'email','aria-label':'E-mail',autocapitalize:'none',autocorrect:'off',spellcheck:'false',inputmode:'email',value:lastEmail});
  em.addEventListener('input',function(){ lastEmail=em.value.trim() });
  var twice=mode==='up'||mode==='new';
  var pw=h('input',{type:'password',autocapitalize:'none',autocorrect:'off',spellcheck:'false',placeholder:mode==='new'?'Nowe hasło':'Hasło',autocomplete:mode==='in'?'current-password':'new-password','aria-label':'Hasło'});
  var pw2=twice?h('input',{type:'password',autocapitalize:'none',autocorrect:'off',spellcheck:'false',placeholder:'Powtórz hasło',autocomplete:'new-password','aria-label':'Powtórz hasło'}):null;
  var eye=h('button',{class:'eye',type:'button','aria-label':'Pokaż hasło','aria-pressed':'false',title:'Pokaż hasło'},eyeIcon(false));
  eye.addEventListener('click',function(){
    var show=pw.type==='password'; pw.type=show?'text':'password'; if(pw2) pw2.type=pw.type;
    eye.setAttribute('aria-pressed',String(show)); var t=show?'Ukryj hasło':'Pokaż hasło'; eye.setAttribute('aria-label',t); eye.title=t; eye.replaceChildren(eyeIcon(show));
  });
  var pwBox=h('div',{class:'pwrow'},pw,eye);
  var pwBox2=pw2?h('div',{class:'pwrow'},pw2):null;
  var msg=h('div',{class:'msg',role:'status'});
  var go=h('button',{class:'btn primary',type:'submit'},{in:'Zaloguj się',up:'Załóż konto',reset:'Wyślij link',new:'Zapisz hasło'}[mode]);
  function say(t,bad){msg.textContent=t; msg.className='msg'+(bad?' bad':'')}
  var form=h('form',{class:'login'},
    h('h1',{text:'Rozkład 3I3'}),
    h('p',{text:{in:'Zaloguj się, żeby zobaczyć rozkład i zadania.',up:'Konto założysz tylko na e-mail, który dodał właściciel.',reset:'Wyślemy link do ustawienia nowego hasła.',new:'Ustaw nowe hasło.'}[mode]}),
    mode==='new'?null:em, mode==='reset'?null:pwBox, pwBox2, twice?h('div',{class:'rule',text:'Hasło: minimum '+PW_MIN+' znaków — litery łacińskie, cyfry, spacje i znaki specjalne.'}):null, go, msg,
    mode==='in'?h('button',{class:'lnk',type:'button',onclick:function(){showLogin('up')}},'Nie mam konta — załóż'):null,
    mode==='in'?h('button',{class:'lnk',type:'button',onclick:function(){showLogin('reset')}},'Nie pamiętam hasła'):null,
    mode!=='in'?h('button',{class:'lnk',type:'button',onclick:function(){showLogin('in')}},'Wróć do logowania'):null);
  form.addEventListener('submit',async function(ev){
    ev.preventDefault(); say(''); go.disabled=true;
    var e=em.value.trim().toLowerCase(), p=pw.value;
    if(e) rememberEmail(e);
    if(twice){ var bad=pwProblem(p,pw2.value); if(bad){ say(bad,true); go.disabled=false; return } }
    try{
      var here=location.origin+location.pathname;
      if(mode==='in'){
        var r=await SB.auth.signInWithPassword({email:e,password:p}); if(r.error) throw r.error;
      } else if(mode==='up'){
        var ok=await SB.rpc('can_join',{p_email:e});
        if(ok.error) throw ok.error;
        if(!ok.data){ say('Ten e-mail nie został dodany przez właściciela rozkładu.',true); go.disabled=false; return }
        var u=await SB.auth.signUp({email:e,password:p,options:{emailRedirectTo:here}}); if(u.error) throw u.error;
        if(!u.data.session) say('Prawie gotowe! Otwórz e-mail i kliknij link potwierdzający, potem się zaloguj.');
      } else if(mode==='reset'){
        var rs=await SB.auth.resetPasswordForEmail(e,{redirectTo:here}); if(rs.error) throw rs.error;
        say('Jeśli konto istnieje, link jest już w skrzynce.');
      } else if(mode==='new'){
        var nu=await SB.auth.updateUser({password:p}); if(nu.error) throw nu.error;
        recovering=false; toast('Hasło zmienione'); history.replaceState(null,'',location.pathname); start();
      }
    }catch(err){ say(authMsg(err),true); }
    go.disabled=false;
  });
  $('#app').replaceChildren(form);
  (mode==='new'||(mode==='in'&&em.value)?pw:em).focus();
}
var starting=null;
function start(){ if(!starting) starting=startNow().finally(function(){starting=null}); return starting }
var recovering=/type=recovery/.test(location.hash+location.search);
/* sign out on this device even if the server can't be reached or the session already expired */
async function logout(){
  try{ await SB.auth.signOut({scope:'local'}) }catch(e){}
  try{ for(var i=localStorage.length-1;i>=0;i--){ var k=localStorage.key(i); if(/^sb-.*-auth-token/.test(k)) localStorage.removeItem(k) } }catch(e){}
  showLogin();
}
async function startNow(){
  var s=await SB.auth.getSession(), session=s.data&&s.data.session;
  if(recovering&&session){ showLogin('new'); return }
  if(!session){ showLogin(); return }
  S.user={id:session.user.id,email:(session.user.email||'').toLowerCase()};
  document.body.classList.remove('auth'); applyTheme();
  $('#app').replaceChildren(h('div',{class:'skeleton','aria-label':'Ładowanie rozkładu'}));
  var m=await SB.from('members').select('*').eq('email',S.user.email).maybeSingle();
  if(m.error||!m.data){
    document.body.classList.add('auth'); applyTheme();
    $('#app').replaceChildren(h('div',{class:'login'},h('h1',{text:'Brak dostępu'}),
      h('p',{text:'Konto '+S.user.email+' nie zostało dodane do tego rozkładu. Poproś właściciela, żeby Cię dodał.'}),
      h('button',{class:'btn',type:'button',onclick:function(){logout()}},'Wyloguj się')));
    return;
  }
  S.role=m.data.role;
  await load();
}

/* ---------- boot ---------- */
applyTheme();
(function(){
  var cfg=window.RZ_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey||/WKLEJ/.test(cfg.url+cfg.anonKey)){
    fail('Brakuje ustawień połączenia (plik config.js)'); return;
  }
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(function(ev){
    if(ev==='PASSWORD_RECOVERY'){ recovering=true; setTimeout(function(){showLogin('new')},0); return }
    if(ev==='SIGNED_OUT'){ setTimeout(function(){showLogin()},0); return }
    if(ev==='SIGNED_IN'&&!S.user){ setTimeout(start,0) }
  });
  start();
  /* refresh what others added when you come back to the app, and every minute while it's open */
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&S.ready) load() });
  setInterval(function(){ if(document.visibilityState==='visible'&&S.ready&&!dragging) load() },60000);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
})();
</script>
