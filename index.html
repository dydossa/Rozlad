<script>
/* Pick the look before anything is drawn: neutral on the sign-in screen,
   otherwise the user's saved choice, or the device setting if they never chose. */
(function(){
  var saved=null, signedIn=false;
  try{ saved=localStorage.getItem('rz.theme');
       for(var i=0;i<localStorage.length;i++){ var k=localStorage.key(i); if(/^sb-.*-auth-token$/.test(k)) signedIn=true } }catch(e){}
  var sys=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  var t=signedIn?((saved==='light'||saved==='dark')?saved:sys):'neutral';
  document.documentElement.setAttribute('data-theme',t);
  document.getElementById('themeColor').setAttribute('content',t==='dark'?'#0e0a08':t==='light'?'#ffffff':'#ececee');
})();
</script>

<style>
/* Layout: sticky toolbar with zjazd numbers. Wide screens get a horizontal timetable like the university PDF (one row per day, time left to right). Phones get two swipe pages, Sobota and Niedziela, with one card per class and a quick field for homework. Sheets slide up on phones and in from the right on desktop. */
:root{
  /* light: calm and soft */
  --bg:#f3f5f8; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#1e2531; --ink-2:#5c6676; --line:#e1e6ed;
  --accent:#3d6fd9; --accent-ink:#ffffff; --danger:#c8372d; --scrim:rgba(20,28,40,.35);
  --top:rgba(255,255,255,.88); --glow:none; --card-shadow:0 1px 2px rgba(20,30,50,.05),0 4px 14px rgba(20,30,50,.05);
  --wyk-bg:#fff4cf; --wyk-bd:#d9a520;
  --lab-bg:#e1edff; --lab-bd:#4a82dd;
  --proj-bg:#ffe3df; --proj-bd:#de5c48;
  --lek-bg:#def3df; --lek-bd:#46a052;
  --cw-bg:#ede4fb; --cw-bd:#8b66c6;
  --inne-bg:#eef0f3; --inne-bd:#8d97a6; --band:#f8fafc;
  --font:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-c:'IBM Plex Sans Condensed','IBM Plex Sans',system-ui,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Consolas,monospace;
}
:root[data-theme="dark"]{
  /* dark: foundry — basalt, cooled crust, molten metal */
  --bg:#080605; --surface:#16110e; --surface-2:#1e1713; --ink:#f2e6dc; --ink-2:#ad9585; --line:#33261f;
  --accent:#ff7417; --accent-ink:#170900; --danger:#ff6b55; --scrim:rgba(0,0,0,.66);
  --top:rgba(14,10,8,.86); --glow:0 0 0 1px rgba(255,116,23,.28),0 0 22px rgba(255,80,10,.18); --card-shadow:0 2px 16px rgba(0,0,0,.6);
  --wyk-bg:#2e200d; --wyk-bd:#f0a830;
  --lab-bg:#171f29; --lab-bd:#6a9fd4;
  --proj-bg:#36140e; --proj-bd:#ff5530;
  --lek-bg:#1a2416; --lek-bd:#86b84c;
  --cw-bg:#261b2d; --cw-bd:#b98af0;
  --inne-bg:#221b17; --inne-bd:#9d8b80; --band:#1a1411;
  color-scheme:dark;
}
:root[data-theme="neutral"]{
  /* sign-in screen: one neutral look for everybody */
  --bg:#ececee; --surface:#ffffff; --surface-2:#f4f4f6; --ink:#1f1f23; --ink-2:#64646c; --line:#dcdce0;
  --accent:#2f2f36; --accent-ink:#ffffff; --danger:#c0392b; --top:#ffffff; --glow:none; --card-shadow:0 6px 30px rgba(0,0,0,.08);
}

:root[data-theme="dark"] .top{border-bottom-color:#ff741740;box-shadow:0 1px 0 #ff741726,0 8px 26px rgba(0,0,0,.5)}
.sched,.card,.empty,.login,.gap{box-shadow:var(--card-shadow)}
.gap{background-color:color-mix(in srgb,var(--surface) 72%,transparent)}
:root[data-theme="dark"] .gap{background-color:color-mix(in srgb,var(--surface) 90%,transparent);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.blk:hover,.card:hover{box-shadow:var(--glow),var(--card-shadow)}
:root[data-theme="dark"] .btn.primary{box-shadow:var(--glow);background:linear-gradient(180deg,#ff8a2a,#e85d0c);border-color:#ff8a2a}

[hidden]{display:none!important}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.wrap{max-width:1500px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* toolbar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--surface);border-bottom:1px solid var(--line)}
.row1{display:flex;align-items:center;gap:10px;padding-block:10px 6px;flex-wrap:wrap}
.termpick{flex:1 1 160px;min-width:0}
.termpick select{width:100%;font-size:19px;font-weight:600;letter-spacing:-.01em;background:transparent;border:0;padding:4px 0;text-overflow:ellipsis;cursor:pointer}
.tools{display:flex;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;display:inline-flex;align-items:center;gap:6px;min-height:36px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.06);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:var(--danger)}
.btn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.icon{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer}
.icon:hover{background:var(--surface-2)}
.icon svg,.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.badge{background:var(--accent);color:var(--accent-ink);border-radius:99px;font-size:11px;padding:0 6px;min-width:18px;text-align:center;line-height:18px;font-family:var(--mono)}
.weeks{display:flex;gap:6px;align-items:center;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.weeks::-webkit-scrollbar{display:none}
.wk-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);margin-right:2px;flex:none}
.chip{position:relative;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:5px 12px;cursor:pointer;font-family:var(--mono);font-size:15px;font-weight:500;min-width:44px;height:38px;text-align:center}
.chip[aria-selected="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chip.has::after{content:"";position:absolute;top:4px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
.chip[aria-selected="true"].has::after{background:var(--surface)}
.daytabs{display:none;gap:0;border-top:1px solid var(--line);margin:0 calc(-1 * max(16px,env(safe-area-inset-left,0px)))}
.daytab{flex:1;border:0;background:transparent;padding:11px 8px 10px;font-weight:600;font-size:15px;cursor:pointer;color:var(--ink-2);border-bottom:3px solid transparent;display:flex;justify-content:center;gap:8px;align-items:center}
.daytab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}

/* wide screens: horizontal timetable, six equal columns of two hours */
main{padding-top:18px}
.hint{background:var(--surface);border:1px dashed var(--accent);border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;color:var(--ink-2);display:grid;gap:8px}
.copyrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.copyrow select{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 8px;min-height:36px}
.sched{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow-x:auto;overscroll-behavior-x:contain}
.tl{min-width:calc(46px + var(--n) * 184px)}
.hrow,.drow{display:flex}
.dcorner,.dlabel{position:sticky;left:0;z-index:4;width:46px;flex:none;background:var(--surface);border-right:1px solid var(--line)}
.hrow{border-bottom:1px solid var(--line)}
.haxis{flex:1;min-width:0;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr))}
.hcell{padding:11px 0;text-align:center;font-family:var(--mono);font-size:12.5px;letter-spacing:.02em;color:var(--ink-2);border-left:1px solid var(--line)}
.hcell:first-child{border-left:0}
.drow+.drow{border-top:1px solid var(--line)}
.dlabel{display:grid;place-items:center;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2)}
.dlabel span{writing-mode:vertical-rl;transform:rotate(180deg);white-space:nowrap}
.dtrack{position:relative;flex:1;min-width:0;background-image:linear-gradient(90deg,var(--band) 50%,transparent 50%),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:calc(200% / var(--n)) 100%,calc(100% / var(--n)) 100%}
.editing .dtrack{cursor:copy}
.dtrack .none{position:absolute;inset:0;display:grid;place-items:center;color:var(--ink-2);font-size:13px;pointer-events:none}
.blk{position:absolute;border-radius:10px;padding:9px 11px 9px 13px;overflow:hidden;background:var(--k-bg);border:1px solid var(--k-bd);border-left-width:5px;font-size:13px;line-height:1.25;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:4px;user-select:none;-webkit-user-select:none;transition:filter .12s,box-shadow .12s}
.blk:hover{filter:brightness(.97);box-shadow:0 2px 10px rgba(0,0,0,.08)}
.k-wyk{--k-bg:var(--wyk-bg);--k-bd:var(--wyk-bd)}
.k-lab{--k-bg:var(--lab-bg);--k-bd:var(--lab-bd)}
.k-proj{--k-bg:var(--proj-bg);--k-bd:var(--proj-bd)}
.k-lek{--k-bg:var(--lek-bg);--k-bd:var(--lek-bd)}
.k-cw{--k-bg:var(--cw-bg);--k-bd:var(--cw-bd)}
.k-inne{--k-bg:var(--inne-bg);--k-bd:var(--inne-bd)}
.blk .kind{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);min-height:16px}
.blk .nm{flex:0 0 auto;font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.blk .rm{flex:0 0 auto;font-family:var(--mono);font-size:12px;font-weight:500}
.blk .te{font-size:11.5px;color:var(--ink-2);margin-top:auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.blk .hw{background:var(--ink);color:var(--surface);border-radius:99px;font-family:var(--mono);font-size:10.5px;padding:0 6px;line-height:16px;letter-spacing:0}
.editing .blk{touch-action:none;cursor:grab;outline:1px dashed var(--ink-2);outline-offset:-1px}
.blk.drag{cursor:grabbing;z-index:5;box-shadow:0 8px 22px rgba(0,0,0,.28);transition:none}
.empty{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:28px 20px;text-align:center;display:grid;gap:12px;justify-items:center}
.empty h2{margin:0;font-size:20px}
.empty p{margin:0;color:var(--ink-2);max-width:46ch}
.skeleton{height:320px;border-radius:10px;background:linear-gradient(90deg,var(--surface) 0,var(--surface-2) 50%,var(--surface) 100%);background-size:200% 100%;animation:sh 1.4s infinite linear}
@keyframes sh{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}.sheet,.scrim{transition:none!important}.pages{scroll-behavior:auto!important}}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:12px;font-size:12px;color:var(--ink-2)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--k-bg);border:1px solid var(--k-bd)}

/* phones: two pages, one card per class */
.pages{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;overscroll-behavior-x:contain}
.pages::-webkit-scrollbar{display:none}
.page{flex:0 0 100%;scroll-snap-align:start;scroll-snap-stop:always;display:grid;gap:12px;align-content:start;min-width:0;padding-bottom:24px}
.card{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-left:6px solid var(--k-bd);border-radius:12px;overflow:hidden;min-width:0;padding:0;cursor:pointer}
.card:active{filter:brightness(.97)}
.chead{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:10px;align-items:start;background:var(--k-bg);padding:12px 14px}
.gap{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1.5px dashed var(--line);border-radius:12px;color:var(--ink-2);background:repeating-linear-gradient(135deg,transparent 0 8px,color-mix(in srgb,var(--line) 35%,transparent) 8px 9px)}
.gap .gtime{font-family:var(--mono);font-size:13px;white-space:nowrap}
.gap .gtxt{font-size:14px}
.gap .gtxt b{display:block;font-weight:600;color:var(--ink);font-size:16px}
.ctime{font-family:var(--mono);font-size:13px;line-height:1.35;color:var(--ink-2)}
.ctime b{display:block;color:var(--ink);font-weight:500;font-size:15px}
.cmain{min-width:0}
.ckind{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.cname{font-weight:600;font-size:17px;line-height:1.25;overflow-wrap:anywhere}
.cmeta{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.cfiles{font-family:var(--mono);font-size:11px;color:var(--ink-2);border:1px solid var(--k-bd);border-radius:99px;padding:1px 8px;white-space:nowrap}
.ctasks{padding:8px 14px 12px;display:grid;gap:4px}
.ctask{display:grid;grid-template-columns:14px minmax(0,1fr);gap:8px;align-items:start;font-size:15px}
.ctask i{width:7px;height:7px;border-radius:50%;background:var(--k-bd);margin-top:8px}
.ctask span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card,.gap{height:172px;box-sizing:border-box}
.card{display:flex;flex-direction:column}
.card .chead{flex:0 0 auto}
.card .ctasks{flex:1 1 auto;min-height:0;overflow:hidden}
.card .cname{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .cmeta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdone{font-size:12px;color:var(--ink-2)}
.cnone{font-size:13px;color:var(--ink-2)}
@media (max-width:820px){
  #btnEdit{display:none}
  .daytabs{display:flex}
  .row1{padding-block:8px 2px}
  .termpick select{font-size:17px}
  .btn .lbl{display:none}
  main{padding-top:12px}
  input,textarea,select{font-size:16px}
}

/* sheets */
.layer{position:fixed;inset:0;pointer-events:none}
.scrim{position:absolute;inset:0;background:var(--scrim);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;transform:translateY(102%);transition:transform .22s ease;padding:0 max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.layer.open{pointer-events:auto}
.layer.open .scrim{opacity:1}
.layer.open .sheet{transform:none;box-shadow:0 -8px 30px rgba(0,0,0,.25)}
@media (min-width:821px){
  .sheet{top:0;left:auto;right:0;width:460px;max-height:none;border-radius:0;transform:translateX(102%);padding-right:20px;padding-left:20px}
}
.sh-head{position:sticky;top:0;background:var(--surface);display:flex;align-items:center;gap:8px;padding:14px 0 10px;border-bottom:1px solid var(--line);margin-bottom:14px;z-index:2}
.sh-head h2{margin:0;font-size:17px;flex:1;min-width:0}
.sh-head input.title{flex:1;min-width:0;font-size:17px;font-weight:600;border:1px solid transparent;border-radius:6px;padding:4px 6px;background:transparent}
.sh-head input.title:hover,.sh-head input.title:focus{border-color:var(--line);background:var(--surface-2)}
.wkpill{flex:none;font-family:var(--mono);font-size:12px;background:var(--ink);color:var(--surface);border-radius:99px;padding:2px 10px}
.sec{margin-bottom:22px}
.sec h3{margin:0 0 8px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
.field{display:grid;gap:4px;margin-bottom:12px}
.field label{font-size:12px;color:var(--ink-2)}
.field input,.field select,.field textarea,.addrow textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:8px 10px;min-height:38px}
.field input:focus,.field select:focus,.field textarea:focus,.addrow textarea:focus{outline:2px solid var(--accent);outline-offset:0;background:var(--surface)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.err{color:var(--danger);font-size:13px;min-height:1em;margin:4px 0}
.muted{color:var(--ink-2);font-size:13px}
.slotinfo{display:grid;gap:6px}
.slotrow{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-left:4px solid var(--k-bd);background:var(--k-bg);border-radius:8px;padding:7px 10px;font-size:13px}
.slotrow .mono{font-family:var(--mono);font-size:12px;color:var(--ink-2)}
.hwlist{display:grid;gap:6px;margin-bottom:10px}
.hwitem{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2)}
.hwitem input[type=checkbox]{width:22px;height:22px;margin:1px 0 0;accent-color:var(--accent)}
.hwitem p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.hwitem.done p{text-decoration:line-through;color:var(--ink-2)}
.hwitem p.editable{cursor:text}
.hwitem .who{font-size:12px;color:var(--ink-2);margin-top:2px}
.hwitem textarea.hwedit{width:100%;border:1px solid var(--accent);border-radius:6px;padding:6px 8px;background:var(--surface);resize:vertical}
/* sign-in screen */
body.auth .top{display:none}
.login{max-width:400px;margin:8vh auto 0;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:26px 22px;display:grid;gap:14px}
.login h1{margin:0;font-size:24px;letter-spacing:-.01em}
.login p{margin:0;color:var(--ink-2);font-size:14px}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2);font-size:16px}
.login .btn{justify-content:center;min-height:44px}
.pwrow{position:relative}
.pwrow input{padding-right:48px}
.pwrow .eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:40px;height:40px;display:grid;place-items:center;border:0;background:transparent;color:var(--ink-2);border-radius:8px;cursor:pointer}
.pwrow .eye:hover{color:var(--ink)}
.pwrow .eye svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.profile{display:flex;align-items:center;gap:12px;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);margin-bottom:6px}
.avatar{width:44px;height:44px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:600;font-size:18px}
.profile .pn{flex:1;min-width:0;display:grid}
.profile .pn b{font-size:16px}
.profile .pn span{font-size:13px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mcap{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-2);margin:20px 6px 7px;font-weight:500}
.mgroup{border:1px solid var(--line);border-radius:14px;background:var(--surface-2);overflow:hidden}
.mgroup>*+*{border-top:1px solid var(--line)}
.mline{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;min-height:52px}
.mline span{font-weight:500}
.mline input{width:min(60%,260px);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface);text-align:right}
.mline input[type=number]{width:90px}
.mfold summary,.mlink{display:flex;align-items:center;gap:12px;padding:12px 14px;min-height:52px;cursor:pointer;list-style:none;width:100%;border:0;background:none;text-align:left;font:inherit;color:inherit}
.mfold summary::-webkit-details-marker{display:none}
.mfold summary:hover,.mlink:hover{background:color-mix(in srgb,var(--ink) 4%,transparent)}
.mi{width:32px;height:32px;flex:none;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.mi svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.mt{flex:1;min-width:0;display:grid}
.mt b{font-weight:500}
.mt small{font-size:12.5px;color:var(--ink-2)}
.chev{width:9px;height:9px;border-right:2px solid var(--ink-2);border-bottom:2px solid var(--ink-2);transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
.mfold[open] .chev{transform:rotate(45deg)}
.mbody{padding:4px 14px 16px}
.mbody .mrow{background:var(--surface)}
.addp{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
.mlink.danger{color:var(--danger)}
.mlink.danger .mt small{color:var(--danger);opacity:.8}
.pwform{display:grid;gap:10px}
.pwform input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:var(--surface-2);font-size:16px}
.pwform .rule{font-size:12.5px;color:var(--ink-2)}
.pwform .msg{font-size:14px;min-height:1em}.pwform .msg.bad{color:var(--danger)}
.login .rule{font-size:12.5px;color:var(--ink-2);margin-top:-6px}
.login .lnk{background:none;border:0;color:var(--accent);cursor:pointer;padding:4px 0;font-size:14px;text-align:center}
.login .msg{font-size:14px;min-height:1em}
.login .msg.bad{color:var(--danger)}
.mrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);margin-bottom:8px}
.mrow .n{flex:1;min-width:0}
.mrow .n b{display:block;font-weight:600}
.mrow .n span{font-size:13px;color:var(--ink-2);overflow-wrap:anywhere}
.role{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:99px;padding:1px 8px;color:var(--ink-2);white-space:nowrap}
.x{border:0;background:transparent;cursor:pointer;color:var(--ink-2);padding:6px;border-radius:6px;line-height:0}
.x:hover{color:var(--danger);background:var(--surface)}
.x svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
.addrow{display:grid;gap:8px}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-bottom:10px}
.file{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface-2);display:grid;grid-template-rows:auto auto;min-width:0}
.file a.thumb{display:grid;place-items:center;aspect-ratio:4/3;background:var(--surface);text-decoration:none;color:var(--ink-2);overflow:hidden}
.file a.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.file .ft{font-family:var(--mono);font-size:20px;font-weight:500;letter-spacing:.04em}
.file .meta{padding:6px 8px;display:flex;gap:4px;align-items:center;justify-content:space-between;min-width:0}
.file .meta span{font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.drop{border:1.5px dashed var(--line);border-radius:10px;padding:14px;text-align:center;color:var(--ink-2);font-size:13px;display:grid;gap:8px;justify-items:center}
.drop.over{border-color:var(--accent);background:var(--surface-2)}
.subjrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);padding:12px;cursor:pointer;margin-bottom:8px}
.subjrow:hover{background:var(--surface)}
.subjrow .n{flex:1;min-width:0;font-weight:500;overflow-wrap:anywhere}
.subjrow .s{font-family:var(--mono);font-size:11px;color:var(--ink-2);white-space:nowrap}
.daychips{display:flex;flex-wrap:wrap;gap:6px}

<body>
<div class="scene" aria-hidden="true"><div class="rock"></div><div class="heat"></div><span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span><span class="spark s4"></span><span class="spark s5"></span><span class="spark s6"></span></div>
<header class="top"><div class="wrap">
  <div class="row1">
    <label class="termpick"><span class="sr">Rozkład</span><select id="termSel"></select></label>
    <div class="tools">

      </button>
      <button class="icon" id="btnMenu" type="button" aria-label="Ustawienia">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <button class="icon" id="btnTheme" type="button" aria-label="Zmień motyw"></button>
    </div>
  </div>
  <div class="weeks" id="weeks" role="tablist" aria-label="Zjazd"></div>
  <div class="daytabs" id="dayTabs" role="tablist" aria-label="Dzień"></div>
</div></header>
<main class="wrap" id="app"><div class="skeleton" aria-label="Ładowanie rozkładu"></div></main>
<div id="toast" role="status"></div>

<script>
(function(){
'use strict';
/* Stored day keys stay as saved in the database; DAYPL is only for display. */
var WEEKDAYS=['Понеділок','Вівторок','Середа','Четвер','Пʼятниця','Субота','Неділя'];
var DAYPL={'Понеділок':'Poniedziałek','Вівторок':'Wtorek','Середа':'Środa','Четвер':'Czwartek','Пʼятниця':'Piątek','Субота':'Sobota','Неділя':'Niedziela'};
function dayName(d){return DAYPL[d]||d}
var KINDS=['Wykład','Laboratorium','Projekt','Lektorat','Ćwiczenia','Inne'];
var KCLS={'Wykład':'wyk','Laboratorium':'lab','Projekt':'proj','Lektorat':'lek','Ćwiczenia':'cw','Inne':'inne'};
var COL=120, BH=134, GAP=6; /* every class is two hours, from a full hour to a full hour */
var S={terms:[],subjects:[],slots:[],homework:[],files:[],members:[],termId:null,week:1,page:0,edit:false,ready:false,user:null,role:null};
var SB=null, dragging=false, pendingRender=false, open={id:null,week:null};
function isOwner(){return S.role==='owner'}
function canEdit(x){return isOwner()||(S.user&&x.author===S.user.id)}
function authorName(x){
  if(S.user&&x.author===S.user.id) return 'Ty';
  var m=S.members.find(function(m){return m.email===x.authorEmail});
  return (m&&m.name)||(x.authorEmail||'').split('@')[0]||'?';
}
var mq=window.matchMedia?window.matchMedia('(max-width:820px)'):{matches:false};
function isPhone(){return !!mq.matches}

/* ---------- helpers ---------- */
function $(s,r){return (r||document).querySelector(s)}
function h(tag,props){
  var e=document.createElement(tag), p=props||{};
  Object.keys(p).forEach(function(k){
    var v=p[k]; if(v==null||v===false) return;
    if(k==='class') e.className=v;
    else if(k==='text') e.textContent=v;
    else if(k==='value'||k==='checked'||k==='disabled') e[k]=v;
    else if(k.slice(0,2)==='on') e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  });
  for(var i=2;i<arguments.length;i++){ add(e,arguments[i]); }
  return e;
}
function add(e,c){ if(c==null||c===false) return; if(Array.isArray(c)) c.forEach(function(x){add(e,x)}); else e.append(c.nodeType?c:document.createTextNode(String(c))); }
function cl(x){return JSON.parse(JSON.stringify(x))}
function uid(){ try{return crypto.randomUUID().replace(/-/g,'').slice(0,10)}catch(e){return Math.random().toString(36).slice(2,12)} }
function pad(n){return (n<10?'0':'')+n}
function fmt(m){return pad(Math.floor(m/60))+':'+pad(m%60)}
function parseT(s){var m=/^(\d{1,2}):(\d{2})/.exec(s||''); return m?(+m[1])*60+(+m[2]):null}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function icon(name){
  var P={x:'<path d="M6 6l12 12M18 6L6 18"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24'); s.innerHTML=P[name]; return s;
}
var toastT;
function toast(msg){var t=$('#toast'); t.textContent=msg; t.classList.add('on'); clearTimeout(toastT); toastT=setTimeout(function(){t.classList.remove('on')},3200)}
function parseWeeks(str){
  if(!str||!String(str).trim()) return [];
  var set={}, parts=String(str).split(/[,;\s]+/);
  for(var i=0;i<parts.length;i++){
    if(!parts[i]) continue;
    var m=/^(\d+)(?:[-–](\d+))?$/.exec(parts[i]); if(!m) return null;
    var a=+m[1], b=m[2]?+m[2]:a; if(b<a||a<1||b>60) return null;
    for(var k=a;k<=b;k++) set[k]=1;
  }
  return Object.keys(set).map(Number);
}
function curTerm(){return S.terms.find(function(t){return t.id===S.termId})||null}
function subj(id){return S.subjects.find(function(s){return s.id===id})||null}
function weekSlots(w){return S.slots.filter(function(s){return s.termId===S.termId&&s.week===w})}
function termSlots(){return S.slots.filter(function(s){return s.termId===S.termId})}
function inNote(week,sid){return function(x){return x.termId===S.termId&&x.week===week&&x.subjectId===sid}}
function getNote(week,sid){
  return {homework:S.homework.filter(inNote(week,sid)),files:S.files.filter(inNote(week,sid))};
}
function openHw(week){
  return S.homework.filter(function(x){return x.termId===S.termId&&x.week===week&&!x.done}).length;
}
function openHwDay(week,day){
  var ids={}; weekSlots(week).forEach(function(z){if(z.day===day) ids[z.subjectId]=1});
  return Object.keys(ids).reduce(function(n,sid){return n+getNote(week,sid).homework.filter(function(y){return !y.done}).length},0);
}

/* ---------- database (Supabase) ---------- */
/* App objects use camelCase; table columns use snake_case. */
var COLS={termId:'term_id',subjectId:'subject_id',weekCount:'week_count',createdAt:'created_at',start:'start_min',end:'end_min',authorEmail:'author_email'};
var PROPS={}; Object.keys(COLS).forEach(function(k){PROPS[COLS[k]]=k});
function toRow(o){var r={}; Object.keys(o).forEach(function(k){r[COLS[k]||k]=o[k]}); return r}
function fromRow(r){var o={}; Object.keys(r).forEach(function(k){o[PROPS[k]||k]=r[k]}); return o}
function applyLocal(table,id,obj){
  var list=S[table]; if(!list) return;
  var i=list.findIndex(function(x){return x.id===id});
  if(obj===null){ if(i>=0) list.splice(i,1); }
  else if(i>=0) list[i]=obj; else list.push(obj);
}
/* write('table/id', data, 'set'|'insert'|'update'|'delete') — writes, then mirrors the saved row locally */
var queues={};
function write(path,data,mode){
  if(!SB){toast('Brak połączenia z bazą'); return Promise.resolve(false)}
  var parts=path.split('/'), table=parts[0], id=parts[1];
  var prev=queues[path]||Promise.resolve();
  var p=prev.catch(function(){}).then(function(){
    var q=SB.from(table), row=data?toRow(data):null;
    if(row) row.id=id;
    if(mode==='delete') q=q.delete().eq('id',id);
    else if(mode==='update'){ delete row.id; q=q.update(row).eq('id',id); }
    else if(mode==='insert') q=q.insert(row);
    else q=q.upsert(row);
    return q.select();
  }).then(function(res){
    if(res.error) throw res.error;
    if(!res.data||!res.data.length) throw {code:'denied'};
    applyLocal(table,id,mode==='delete'?null:fromRow(res.data[0]));
    if(table==='terms') ensureTerm();
    scheduleRender(); return true;
  }).catch(function(e){
    console.error(e);
    toast(e&&e.code==='denied'||e&&e.code==='42501'?'Nie masz uprawnień do tej zmiany':'Nie udało się zapisać. Sprawdź internet i spróbuj ponownie');
    return false;
  });
  queues[path]=p; return p;
}
/* load everything the signed-in member may see */
var loading=null;
function load(){
  if(loading) return loading;
  function all(t,order){return SB.from(t).select('*').order(order||'id').range(0,9999)}
  loading=Promise.all([all('terms','created_at'),all('subjects','created_at'),all('slots'),all('homework','created_at'),all('files','created_at'),all('members','added_at')])
  .then(function(r){
    var bad=r.find(function(x){return x.error}); if(bad) throw bad.error;
    ['terms','subjects','slots','homework','files','members'].forEach(function(t,i){S[t]=r[i].data.map(fromRow)});
    ensureTerm(); S.ready=true; scheduleRender();
  }).catch(function(e){ console.error(e); if(!S.ready) fail('Nie udało się wczytać danych'); else toast('Nie udało się odświeżyć danych'); })
  .then(function(){loading=null});
  return loading;
}
/* private files are shown through short-lived signed links */
var URLC={};
function signedUrls(paths){
  var now=Date.now(), need=paths.filter(function(p){return !URLC[p]||URLC[p].exp<now});
  if(!need.length) return Promise.resolve();
  return SB.storage.from('files').createSignedUrls(need,3600).then(function(res){
    (res.data||[]).forEach(function(x){ if(x.signedUrl) URLC[x.path]={url:x.signedUrl,exp:now+50*60*1000} });
  });
}
function removeStored(paths){
  if(!paths.length) return Promise.resolve();
  return SB.storage.from('files').remove(paths).then(function(r){ if(r.error) console.error(r.error) });
}

/* ---------- sheets ---------- */
function makeSheet(z){
  var layer=h('div',{class:'layer',style:'z-index:'+z}), scrim=h('div',{class:'scrim'}), sheet=h('div',{class:'sheet',role:'dialog','aria-modal':'true'});
  layer.append(scrim,sheet); document.body.append(layer);
  var api={layer:layer,sheet:sheet,onClose:null,
    open:function(){layer.classList.add('open')},
    close:function(){ if(!layer.classList.contains('open')) return; layer.classList.remove('open'); if(api.onClose) api.onClose(); },
    isOpen:function(){return layer.classList.contains('open')}};
  scrim.addEventListener('click',api.close);
  return api;
}
var subjectsSheet=makeSheet(30), subjectSheet=makeSheet(32), editorSheet=makeSheet(34), settingsSheet=makeSheet(36), accountSheet=makeSheet(38);
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape') return;
  [accountSheet,settingsSheet,editorSheet,subjectSheet,subjectsSheet].some(function(s){ if(s.isOpen()){s.close(); return true} });
});
function sheetHead(title,sh,extra){
  return h('div',{class:'sh-head'}, extra||h('h2',{text:title}),
    h('button',{class:'x',type:'button','aria-label':'Zamknij',onclick:function(){sh.close()}},icon('x')));
}

/* ---------- data wiring ---------- */
function ensureTerm(){
  if(!S.terms.some(function(t){return t.id===S.termId})){
    var saved=null; try{saved=localStorage.getItem('rz.term')}catch(e){}
    var f=S.terms.find(function(t){return t.id===saved})||S.terms[0];
    S.termId=f?f.id:null;
  }
  var t=curTerm(); if(t) S.week=clamp(S.week,1,t.weekCount||10);
}
function fail(msg){
  $('#app').replaceChildren(h('div',{class:'empty'},h('h2',{text:'Rozkład się nie otworzył'}),h('p',{text:msg+'. Sprawdź internet i odśwież stronę.'}),
    h('button',{class:'btn',type:'button',onclick:function(){location.reload()}},'Odśwież')));
}

/* ---------- render ---------- */
function scheduleRender(){
  if(dragging){pendingRender=true; return}
  if(scheduleRender.raf) return;
  scheduleRender.raf=requestAnimationFrame(function(){scheduleRender.raf=0; render()});
}
function render(){
  if(!S.ready) return;
  var keep={}; document.querySelectorAll('[data-k]').forEach(function(n){keep[n.dataset.k]={v:n.value,focus:n===document.activeElement,s:n.selectionStart}});
  renderHeader(); renderApp();
  Object.keys(keep).forEach(function(k){
    var n=document.querySelector('[data-k="'+k+'"]'); if(!n) return;
    n.value=keep[k].v; if(keep[k].focus){ n.focus(); try{n.setSelectionRange(keep[k].s,keep[k].s)}catch(e){} }
  });
  if(subjectSheet.isOpen()&&open.id) renderSubject();
  if(subjectsSheet.isOpen()) renderSubjects();
}
function daysOf(t){return t.days&&t.days.length?t.days:['Субота','Неділя']}
function renderHeader(){
  var sel=$('#termSel'); sel.replaceChildren();
  S.terms.forEach(function(t){sel.append(h('option',{value:t.id,text:t.name||'Bez nazwy',selected:t.id===S.termId}))});
  sel.disabled=!S.terms.length;
  var t=curTerm(), wk=$('#weeks'); wk.replaceChildren();
  if(t){
    wk.append(h('span',{class:'wk-label',text:'Zjazd'}));
    for(var i=1;i<=(t.weekCount||10);i++){
      (function(i){
        wk.append(h('button',{class:'chip'+(openHw(i)?' has':''),type:'button',role:'tab','aria-selected':String(S.week===i),text:String(i),
          onclick:function(){S.week=i; try{localStorage.setItem('rz.week',String(i))}catch(e){} scheduleRender()}}));
      })(i);
    }
    var sel2=wk.querySelector('[aria-selected="true"]'); if(sel2&&sel2.scrollIntoView&&!renderHeader.done){renderHeader.done=true; try{sel2.scrollIntoView({inline:'center',block:'nearest'})}catch(e){}}
  }
  var tabs=$('#dayTabs'); tabs.replaceChildren();
  if(t&&isPhone()){
    var days=daysOf(t); S.page=clamp(S.page,0,days.length-1);
    days.forEach(function(d,i){
      var n=openHwDay(S.week,d);
      tabs.append(h('button',{class:'daytab',type:'button',role:'tab','aria-selected':String(S.page===i),onclick:function(){goPage(i)}},dayName(d),n?h('span',{class:'badge',text:n}):null));
    });
  }
  var b=$('#hwBadge'), n=t?openHw(S.week):0; b.hidden=!n; b.textContent=n;
  var eb=$('#btnEdit'); eb.setAttribute('aria-pressed',String(S.edit)); $('.lbl',eb).textContent=S.edit?'Gotowe':'Edytuj';
  eb.hidden=!isOwner();
}
function goPage(i){
  S.page=i; try{localStorage.setItem('rz.page',String(i))}catch(e){}
  var p=$('#pages'); if(p){ try{p.scrollTo({left:i*p.clientWidth,behavior:'smooth'})}catch(e){p.scrollLeft=i*p.clientWidth} }
  document.querySelectorAll('.daytab').forEach(function(b,k){b.setAttribute('aria-selected',String(k===i))});
}
function lanesFor(list){
  var s=list.slice().sort(function(a,b){return a.start-b.start||a.end-b.end}), ends=[];
  return s.map(function(x){
    var l=0; while(ends[l]!==undefined&&ends[l]>x.start) l++;
    ends[l]=x.end; return {s:x,lane:l};
  });
}
function renderApp(){
  var app=$('#app'), t=curTerm();
  if(!t){
    app.replaceChildren(h('div',{class:'empty'},
      h('h2',{text:'Nie ma jeszcze rozkładu'}),
      h('p',{text:'Utwórz rozkład na semestr. Każdy zjazd ma w nim własną siatkę zajęć, a do każdego przedmiotu w zjeździe możesz dodać zadania i pliki.'}),
      isPhone()||!isOwner()?null:h('button',{class:'btn primary',type:'button',onclick:function(){createTerm('Nowy rozkład',null)}},'Utwórz rozkład')));
    return;
  }
  if(isPhone()){ S.edit=false; renderPhone(app,t); } else renderDesktop(app,t);
}

/* ----- phone: two pages with cards ----- */
function renderPhone(app,t){
  var days=daysOf(t), mine=weekSlots(S.week);
  var pages=h('div',{class:'pages',id:'pages'});
  days.forEach(function(d){
    var ds=mine.filter(function(s){return s.day===d}).sort(function(a,b){return a.start-b.start||a.end-b.end});
    var page=h('section',{class:'page','aria-label':dayName(d)});
    if(!ds.length) page.append(h('div',{class:'empty'},h('h2',{text:'Brak zajęć'}),h('p',{text:dayName(d)+', zjazd '+S.week+'.'})));
    var maxEnd=null;
    ds.forEach(function(s){
      if(maxEnd!==null && s.start>maxEnd){
        for(var g0=maxEnd; g0<s.start; g0+=COL){
          var g1=Math.min(g0+COL,s.start);
          page.append(h('div',{class:'gap','aria-label':'Okienko '+fmt(g0)+'–'+fmt(g1)},
            h('div',{class:'ctime'},h('b',{text:fmt(g0)}),fmt(g1)),
            h('div',{class:'gtxt'},h('b',{text:'Okienko'}),'Brak zajęć')));
        }
      }
      page.append(card(s));
      maxEnd=maxEnd===null?s.end:Math.max(maxEnd,s.end);
    });
    pages.append(page);
  });
  app.replaceChildren(pages);
  var w=pages.clientWidth; pages.style.scrollBehavior='auto'; pages.scrollLeft=S.page*w; pages.style.scrollBehavior='';
  var raf=0;
  pages.addEventListener('scroll',function(){
    if(raf) return;
    raf=requestAnimationFrame(function(){
      raf=0; var i=Math.round(pages.scrollLeft/Math.max(1,pages.clientWidth));
      if(i!==S.page){ S.page=i; try{localStorage.setItem('rz.page',String(i))}catch(e){}
        document.querySelectorAll('.daytab').forEach(function(b,k){b.setAttribute('aria-selected',String(k===i))}); }
    });
  },{passive:true});
}
function card(s){
  var sb=subj(s.subjectId), kc=KCLS[s.kind]||'inne', note=getNote(s.week,s.subjectId);
  var openT=(note.homework||[]).filter(function(x){return !x.done}), doneN=(note.homework||[]).length-openT.length, nf=(note.files||[]).length;
  var head=h('div',{class:'chead'},
    h('div',{class:'ctime'},h('b',{text:fmt(s.start)}),fmt(s.end)),
    h('div',{class:'cmain'},h('div',{class:'ckind',text:s.kind}),h('div',{class:'cname',text:sb?sb.name:'(bez nazwy)'}),
      (s.room||s.teacher)?h('div',{class:'cmeta',text:[s.room,s.teacher].filter(Boolean).join(' · ')}):null),
    nf?h('span',{class:'cfiles',text:nf+' plik.'}):null);
  var tasks=h('div',{class:'ctasks'});
  openT.slice(0,2).forEach(function(x){ tasks.append(h('div',{class:'ctask'},h('i'),h('span',{text:x.text}))) });
  if(!openT.length) tasks.append(h('div',{class:'cnone',text:doneN?'Wszystko zrobione.':'Brak zadań.'}));
  else if(openT.length>2||doneN) tasks.append(h('div',{class:'cdone',text:(openT.length>2?'+'+(openT.length-2)+' więcej':'')+(openT.length>2&&doneN?' · ':'')+(doneN?'Wykonane: '+doneN:'')}));
  var c=h('button',{class:'card k-'+kc,type:'button','aria-label':(sb?sb.name:'')+', '+s.kind+', '+fmt(s.start)+'–'+fmt(s.end)},head,tasks);
  c.addEventListener('click',function(){openSubject(s.subjectId,s.week)});
  return c;
}

/* ----- wide screens: horizontal timetable ----- */
function gridRange(all){
  var gs=8*60, ge=20*60;
  all.forEach(function(s){gs=Math.min(gs,Math.floor(s.start/60)*60); ge=Math.max(ge,Math.ceil(s.end/60)*60)});
  var n=Math.ceil((ge-gs)/COL); return {gs:gs,ge:gs+n*COL,n:n};
}
function renderDesktop(app,t){
  var days=daysOf(t), mine=weekSlots(S.week), g=gridRange(termSlots()), gs=g.gs, ge=g.ge, n=g.n, T=ge-gs, nodes=[];

  if(S.edit){
    var others=[]; for(var i=1;i<=(t.weekCount||10);i++) if(i!==S.week&&weekSlots(i).length) others.push(i);
    var copy=h('div',{class:'copyrow'});
    if(others.length){
      var cs=h('select',{id:'copy-src','aria-label':'Zjazd źródłowy'}); others.forEach(function(w){cs.append(h('option',{value:String(w),text:'Zjazd '+w}))});
      var cb=h('button',{class:'btn',type:'button'},'Skopiuj tutaj'), armed=false;
      cb.addEventListener('click',function(){
        if(mine.length&&!armed){armed=true; cb.textContent='Zastąpić zajęcia tego zjazdu?'; setTimeout(function(){armed=false; cb.textContent='Skopiuj tutaj'},3500); return}
        copyWeek(+cs.value,S.week);
      });
      copy.append(h('span',{text:'Weź rozkład z'}),cs,cb);
    }
    nodes.push(h('div',{class:'hint'},h('div',{text:'Przeciągaj zajęcia na inny dzień lub godzinę (każde trwa 2 godziny). Kliknij zajęcia, aby je edytować, albo puste miejsce, aby dodać nowe.'}),copy));
  }

  var haxis=h('div',{class:'haxis'});
  for(var c=0;c<n;c++) haxis.append(h('div',{class:'hcell',text:fmt(gs+c*COL)+' – '+fmt(gs+(c+1)*COL)}));
  var tl=h('div',{class:'tl',style:'--n:'+n}, h('div',{class:'hrow'},h('div',{class:'dcorner'}),haxis));
  var rowEls=[];
  days.forEach(function(d){

function block(s,lane,gs,T){

  b.addEventListener('pointerdown',function(e){

function startDrag(e,b,s){
  var ctx=$('#sched')._ctx, gs=ctx.gs, ge=ctx.ge, T=ctx.T, days=ctx.days, scroller=ctx.scroller;
  var rects=ctx.rowEls.map(function(r){return r.getBoundingClientRect()}), ppm=rects[0].width/T;
  var di0=Math.max(0,days.indexOf(s.day)), x0=e.clientX, y0=e.clientY, sc0=scroller.scrollLeft, moved=false, last=e, timer=null;
  var res={start:s.start,end:s.end,day:s.day};
  try{b.setPointerCapture(e.pointerId)}catch(err){}
  function apply(){
    var dx=last.clientX-x0+(scroller.scrollLeft-sc0), len=s.end-s.start;
    var col=Math.round((s.start+dx/ppm-gs)/COL); col=clamp(col,0,Math.round((ge-gs-len)/COL));
    res.start=gs+col*COL; res.end=res.start+len;
    var y=last.clientY, di=-1, best=1e9;
    rects.forEach(function(r,i){ var d=y<r.top?r.top-y:y>r.bottom?y-r.bottom:0; if(d<best){best=d;di=i} });
    res.day=days[di];
    b.style.transform='translate('+((res.start-s.start)*ppm)+'px,'+(rects[di].top-rects[di0].top)+'px)';
  }
  function mv(ev){
    last=ev;
    if(!moved){ if(Math.hypot(ev.clientX-x0,ev.clientY-y0)<6) return;
      moved=true; dragging=true; b.classList.add('drag');
      timer=setInterval(function(){
        var r=scroller.getBoundingClientRect(), x=last.clientX;
        if(x>r.right-40) scroller.scrollLeft+=14; else if(x<r.left+80) scroller.scrollLeft-=14; else return;
        apply();
      },30);
    }
    apply();
  }
  function up(){
    b.removeEventListener('pointermove',mv); b.removeEventListener('pointerup',up); b.removeEventListener('pointercancel',up);
    clearInterval(timer);
    try{b.releasePointerCapture(e.pointerId)}catch(err){}
    if(!moved){ openEditor(s); return; }
    dragging=false;
    var changed=res.start!==s.start||res.end!==s.end||res.day!==s.day;
    if(changed) write('slots/'+s.id,{day:res.day,start:res.start,end:res.end},'update');
    pendingRender=false; scheduleRender();
    if(!changed){ b.classList.remove('drag'); b.style.transform=''; }
  }
  b.addEventListener('pointermove',mv); b.addEventListener('pointerup',up); b.addEventListener('pointercancel',up);
  e.preventDefault();
}

function guessType(f){
  var t=(f.type||'').toLowerCase(), n=f.name.toLowerCase();
  var ok=['image/png','image/jpeg','image/gif','image/webp','image/svg+xml','application/pdf','text/plain','text/markdown','text/csv','application/json','video/mp4','video/webm'];
  if(ok.indexOf(t)>=0) return t;
  if(t==='image/jpg') return 'image/jpeg';
  if(/\.(jpe?g)$/.test(n)) return 'image/jpeg';
  if(/\.png$/.test(n)) return 'image/png';
  if(/\.webp$/.test(n)) return 'image/webp';
  if(/\.pdf$/.test(n)) return 'application/pdf';
  if(/\.txt$/.test(n)) return 'text/plain';
  if(/\.md$/.test(n)) return 'text/markdown';
  if(/\.csv$/.test(n)) return 'text/csv';
  return null;
}

async function createTerm(name,copyFrom){
  var id=uid(), days=copyFrom?cl(copyFrom.days):['Субота','Неділя'];
  var ok=await write('terms/'+id,{name:name,days:days,weekCount:copyFrom?(copyFrom.weekCount||10):10,createdAt:Date.now()},'set');
  if(!ok) return;
  if(copyFrom){
    await Promise.all(S.slots.filter(function(z){return z.termId===copyFrom.id}).map(function(z){
      var c=stripId(cl(z)); c.termId=id; return write('slots/'+uid(),c,'set');
    }));
  }
  S.termId=id; S.week=1; try{localStorage.setItem('rz.term',id)}catch(e){} scheduleRender();
}

/* ---------- theme: one button toggles light / dark ---------- */
function sysTheme(){ return window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light' }
function userTheme(){ var t=null; try{t=localStorage.getItem('rz.theme')}catch(e){} return (t==='light'||t==='dark')?t:sysTheme() }
function applyTheme(){
  var t=document.body.classList.contains('auth')?'neutral':userTheme();
  document.documentElement.setAttribute('data-theme',t);
  var m=document.getElementById('themeColor'); if(m) m.setAttribute('content',t==='dark'?'#0e0a08':t==='light'?'#ffffff':'#ececee');
  var b=document.getElementById('btnTheme'); if(!b) return;
  var dark=t==='dark';
  b.setAttribute('aria-label',dark?'Włącz jasny motyw':'Włącz ciemny motyw'); b.title=b.getAttribute('aria-label');
  b.innerHTML=dark
    ? '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>'
    : '<svg viewBox="0 0 24 24"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>';
}
function toggleTheme(){
  var next=userTheme()==='dark'?'light':'dark';
  try{localStorage.setItem('rz.theme',next)}catch(e){}
  applyTheme();
}
if(window.matchMedia){ var tmq=matchMedia('(prefers-color-scheme: dark)'); if(tmq.addEventListener) tmq.addEventListener('change',applyTheme); }

/* ---------- menu: profile, schedule, people, account — grouped ---------- */
function group(title,rows){ return [title?h('div',{class:'mcap',text:title}):null, h('div',{class:'mgroup'},rows)] }
function fold(iconPath,title,sub,body,open){
  var d=h('details',{class:'mfold'});
  if(open) d.open=true;
  var ic=document.createElementNS('http://www.w3.org/2000/svg','svg'); ic.setAttribute('viewBox','0 0 24 24'); ic.innerHTML=iconPath;
  d.append(h('summary',null,h('span',{class:'mi'},ic),h('span',{class:'mt'},h('b',{text:title}),sub?h('small',{text:sub}):null),h('span',{class:'chev'})),h('div',{class:'mbody'},body));
  return d;
}

  out:'<path d="M15 4h3a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2h-3"/><path d="M10 8l-4 4 4 4M6 12h10"/>',

function openMenu(){
  var me=S.user, t=curTerm(), out=[];
  var initial=((S.members.find(function(m){return m.email===me.email})||{}).name||me.email||'?').trim().charAt(0).toUpperCase();
  var myName=(S.members.find(function(m){return m.email===me.email})||{}).name;
  /* who am I */
  out.push(h('div',{class:'profile'},h('span',{class:'avatar',text:initial}),
    h('div',{class:'pn'},h('b',{text:myName||me.email.split('@')[0]}),h('span',{text:me.email})),
    h('span',{class:'role',text:isOwner()?'właściciel':'członek'})));

  /* schedule (owner) */
  if(isOwner()&&t){
    var nameI=h('input',{id:'st-name',type:'text',value:t.name||''});
    nameI.addEventListener('change',function(){var v=nameI.value.trim(); if(v) write('terms/'+t.id,{name:v},'update')});
    var cnt=h('input',{id:'st-weeks',type:'number',min:'1',max:'30',value:String(t.weekCount||10),inputmode:'numeric'});
    cnt.addEventListener('change',function(){var v=clamp(parseInt(cnt.value,10)||10,1,30); cnt.value=v; write('terms/'+t.id,{weekCount:v},'update')});
    var newName=h('input',{id:'nt-name',type:'text',placeholder:'Na przykład Lato 2027'});
    var copyCb=h('input',{type:'checkbox',id:'nt-copy',checked:true});
    var mk=h('button',{class:'btn primary',type:'button',onclick:function(){
      var n=newName.value.trim(); if(!n){toast('Wpisz nazwę rozkładu'); newName.focus(); return}
      accountSheet.close(); createTerm(n,copyCb.checked?curTerm():null);
    }},'Utwórz rozkład');
    out.push(group('Rozkład',[
      h('label',{class:'mline',for:'st-name'},h('span',{text:'Nazwa'}),nameI),
      h('label',{class:'mline',for:'st-weeks'},h('span',{text:'Liczba zjazdów'}),cnt),
      fold(IC.plus,'Nowy rozkład','Na kolejny semestr',[field('Nazwa','nt-name',newName),h('label',{class:'check',for:'nt-copy'},copyCb,'Skopiuj zajęcia z obecnego'),h('div',{class:'actions'},mk)])
    ]));
  }

  /* people */
  var list=h('div',{class:'plist'});
  function drawList(){
    var rows=S.members.slice().sort(function(a,b){return (a.role==='owner'?0:1)-(b.role==='owner'?0:1)||a.email.localeCompare(b.email)});
    list.replaceChildren.apply(list,rows.map(function(m){
      var rm=null;
      if(isOwner()&&m.role!=='owner'){
        rm=h('button',{class:'x',type:'button','aria-label':'Usuń dostęp dla '+m.email},icon('x')); var armed=false;
        rm.addEventListener('click',function(){
          if(!armed){armed=true; rm.style.color='var(--danger)'; toast('Kliknij jeszcze raz, aby odebrać dostęp '+m.email); setTimeout(function(){armed=false; rm.style.color=''},3000); return}
          SB.from('members').delete().eq('email',m.email).select().then(function(r){
            if(r.error||!r.data.length){toast('Nie udało się usunąć'); return}
            S.members=S.members.filter(function(x){return x.email!==m.email}); drawList();
          });
        });
      }
      return h('div',{class:'mrow'},h('div',{class:'n'},h('b',{text:m.name||m.email.split('@')[0]}),h('span',{text:m.email})),
        h('span',{class:'role',text:m.role==='owner'?'właściciel':'członek'}),rm);
    }));
    var c=document.getElementById('ppl-count'); if(c) c.textContent=S.members.length+' '+(S.members.length===1?'osoba':S.members.length<5?'osoby':'osób');
  }
  drawList();
  var pplBody=[list];
  if(isOwner()){
    var em=h('input',{id:'mb-email',type:'email',placeholder:'adres@email.pl',autocomplete:'off',autocapitalize:'none'});
    var nm=h('input',{id:'mb-name',type:'text',placeholder:'np. Kamil'});
    var err=h('div',{class:'err',role:'alert'});
    var addB=h('button',{class:'btn primary',type:'button'},'Dodaj osobę');
    addB.addEventListener('click',function(){
      var e=em.value.trim().toLowerCase(); err.textContent='';
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e)){err.textContent='Wpisz poprawny e-mail.'; return}
      if(S.members.some(function(m){return m.email===e})){err.textContent='Ta osoba już ma dostęp.'; return}
      addB.disabled=true;
      SB.from('members').insert({email:e,name:nm.value.trim()||null,role:'member'}).select().then(function(r){
        addB.disabled=false;
        if(r.error||!r.data.length){err.textContent='Nie udało się dodać.'; return}
        S.members.push(fromRow(r.data[0])); em.value=''; nm.value=''; drawList();
        toast('Dodano. Niech ta osoba otworzy stronę i wybierze „Załóż konto”.');
      });
    });
    pplBody.push(h('div',{class:'addp'},h('p',{class:'muted',text:'Dodane osoby widzą cały rozkład, mogą dodawać zadania i pliki, ale zmieniać i usuwać tylko swoje.'}),
      h('div',{class:'two'},field('E-mail','mb-email',em),field('Imię (opcjonalnie)','mb-name',nm)),err,h('div',{class:'actions'},addB)));
  }
  var pplFold=fold(IC.ppl,'Osoby z dostępem','',pplBody,false);
  $('.mt',pplFold).append(h('small',{id:'ppl-count'}));
  out.push(group('Osoby',[pplFold]));
  setTimeout(drawList,0);

  /* account */
  out.push(group('Konto',[
    fold(IC.pass,'Zmień hasło','',[passwordChanger()],false),
    h('button',{class:'mlink',type:'button',onclick:function(){accountSheet.close(); SB.auth.signOut()}},
      h('span',{class:'mi'}),h('span',{class:'mt'},h('b',{text:'Wyloguj się'})))
  ]));
  var outBtn=out[out.length-1][1].lastChild; var ic=document.createElementNS('http://www.w3.org/2000/svg','svg'); ic.setAttribute('viewBox','0 0 24 24'); ic.innerHTML=IC.out; $('.mi',outBtn).append(ic);

  /* danger zone (owner) */
  if(isOwner()&&t){
    var delLabel='Usuń ten rozkład';
    var delBtn=h('button',{class:'mlink danger',type:'button'},h('span',{class:'mt'},h('b',{text:delLabel}),h('small',{text:'Znikną wszystkie zajęcia, zadania i pliki'}))), armed=false;
    delBtn.addEventListener('click',function(){
      var b=$('b',delBtn);
      if(!armed){armed=true; b.textContent='Kliknij jeszcze raz, aby usunąć'; setTimeout(function(){armed=false; b.textContent=delLabel},4500); return}
      var cur=curTerm(); accountSheet.close();
      var paths=S.files.filter(function(f){return f.termId===cur.id}).map(function(f){return f.path});
      removeStored(paths).then(function(){return write('terms/'+cur.id,null,'delete')}).then(function(ok){ if(ok) load() });
    });
    out.push(group('Strefa niebezpieczna',[delBtn]));
  }
  accountSheet.sheet.replaceChildren.apply(accountSheet.sheet,[sheetHead('Ustawienia',accountSheet)].concat(out.flat()).filter(Boolean));
  accountSheet.open();
}

/* ---------- change password (signed in) ---------- */
function passwordChanger(){
  var NO={autocapitalize:'none',autocorrect:'off',spellcheck:'false',autocomplete:'new-password'};
  var pw=h('input',Object.assign({type:'password',placeholder:'Nowe hasło','aria-label':'Nowe hasło'},NO));
  var pw2=h('input',Object.assign({type:'password',placeholder:'Powtórz nowe hasło','aria-label':'Powtórz nowe hasło'},NO));
  var eye=h('button',{class:'eye',type:'button','aria-label':'Pokaż hasło','aria-pressed':'false',title:'Pokaż hasło'},eyeIcon(false));
  eye.addEventListener('click',function(){
    var show=pw.type==='password'; pw.type=pw2.type=show?'text':'password';
    eye.setAttribute('aria-pressed',String(show)); var t=show?'Ukryj hasło':'Pokaż hasło'; eye.setAttribute('aria-label',t); eye.title=t; eye.replaceChildren(eyeIcon(show));
  });
  var msg=h('div',{class:'msg',role:'status'});
  var go=h('button',{class:'btn primary',type:'submit'},'Zapisz nowe hasło');
  var form=h('form',{class:'pwform'},h('div',{class:'pwrow'},pw,eye),h('div',{class:'pwrow'},pw2),
    h('div',{class:'rule',text:'Minimum '+PW_MIN+' znaków — litery łacińskie, cyfry, spacje i znaki specjalne.'}),
    h('div',{class:'actions'},go),msg);
  form.addEventListener('submit',async function(ev){
    ev.preventDefault(); msg.className='msg'; msg.textContent='';
    var bad=pwProblem(pw.value,pw2.value); if(bad){ msg.className='msg bad'; msg.textContent=bad; return }
    go.disabled=true;
    var r=await SB.auth.updateUser({password:pw.value});
    go.disabled=false;
    if(r.error){ msg.className='msg bad'; msg.textContent=authMsg(r.error); return }
    pw.value=pw2.value=''; msg.textContent='Hasło zmienione. Następnym razem zaloguj się nowym hasłem.'; toast('Hasło zmienione');
  });
  return form;
}

/* ---------- sign in ---------- */
var AUTHERR={'Invalid login credentials':'Zły e-mail lub hasło.','Email not confirmed':'Najpierw potwierdź e-mail — kliknij link w wiadomości, którą dostałeś(-aś).','User already registered':'To konto już istnieje — zaloguj się.','New password should be different from the old password.':'Nowe hasło musi być inne niż obecne.'};
function authMsg(e){
  var m=e&&e.message||'', n=/at least (\d+)/i.exec(m);
  return AUTHERR[m]||(/rate limit/i.test(m)?'Za dużo prób. Poczekaj chwilę.':/Password should be/i.test(m)?'Hasło musi mieć co najmniej '+(n?n[1]:'6')+' znaków (ten limit ustawia Supabase).':'Coś poszło nie tak: '+m);
}
var PW_MIN=6, PW_OK=/^[\x20-\x7E]+$/; /* Latin letters, digits, symbols and spaces; no Polish/Ukrainian letters */
var lastEmail=''; try{lastEmail=localStorage.getItem('rz.email')||''}catch(e){}
function rememberEmail(v){ lastEmail=v; try{ if(v) localStorage.setItem('rz.email',v) }catch(e){} }
function pwProblem(p,p2){
  if(p.length<PW_MIN) return 'Hasło musi mieć co najmniej '+PW_MIN+' znaków.';
  if(!PW_OK.test(p)) return 'Hasło może zawierać tylko litery łacińskie (bez polskich znaków), cyfry, spacje i znaki specjalne.';
  if(p!==p2) return 'Hasła nie są takie same.';
  return '';
}
function eyeIcon(off){
  var s=document.createElementNS('http://www.w3.org/2000/svg','svg'); s.setAttribute('viewBox','0 0 24 24');
  s.innerHTML=off?'<path d="M3 3l18 18"/><path d="M10.6 6.2A9.9 9.9 0 0 1 12 6c5 0 8.5 4.2 9.5 6-.4.8-1.3 2.1-2.6 3.3M6.6 7.7C4.6 9.1 3.3 10.9 2.5 12c1 1.8 4.5 6 9.5 6 1.5 0 2.8-.4 4-.9"/><path d="M9.9 10a3 3 0 0 0 4.1 4.1"/>':'<path d="M2.5 12C3.5 10.2 7 6 12 6s8.5 4.2 9.5 6c-1 1.8-4.5 6-9.5 6s-8.5-4.2-9.5-6z"/><circle cx="12" cy="12" r="3"/>';
  return s;
}
function showLogin(mode){
  mode=mode||'in';
  document.body.classList.add('auth'); applyTheme(); S.ready=false; S.user=null; S.role=null;
  [accountSheet,settingsSheet,editorSheet,subjectSheet,subjectsSheet].forEach(function(s){s.close()});
  var em=h('input',{type:'email',placeholder:'E-mail',autocomplete:'email','aria-label':'E-mail',autocapitalize:'none',autocorrect:'off',spellcheck:'false',inputmode:'email',value:lastEmail});
  em.addEventListener('input',function(){ lastEmail=em.value.trim() });
  var twice=mode==='up'||mode==='new';
  var pw=h('input',{type:'password',autocapitalize:'none',autocorrect:'off',spellcheck:'false',placeholder:mode==='new'?'Nowe hasło':'Hasło',autocomplete:mode==='in'?'current-password':'new-password','aria-label':'Hasło'});
  var pw2=twice?h('input',{type:'password',autocapitalize:'none',autocorrect:'off',spellcheck:'false',placeholder:'Powtórz hasło',autocomplete:'new-password','aria-label':'Powtórz hasło'}):null;
  var eye=h('button',{class:'eye',type:'button','aria-label':'Pokaż hasło','aria-pressed':'false',title:'Pokaż hasło'},eyeIcon(false));
  eye.addEventListener('click',function(){
    var show=pw.type==='password'; pw.type=show?'text':'password'; if(pw2) pw2.type=pw.type;
    eye.setAttribute('aria-pressed',String(show)); var t=show?'Ukryj hasło':'Pokaż hasło'; eye.setAttribute('aria-label',t); eye.title=t; eye.replaceChildren(eyeIcon(show));
  });
  var pwBox=h('div',{class:'pwrow'},pw,eye);
  var pwBox2=pw2?h('div',{class:'pwrow'},pw2):null;
  var msg=h('div',{class:'msg',role:'status'});
  var go=h('button',{class:'btn primary',type:'submit'},{in:'Zaloguj się',up:'Załóż konto',reset:'Wyślij link',new:'Zapisz hasło'}[mode]);
  function say(t,bad){msg.textContent=t; msg.className='msg'+(bad?' bad':'')}
  var form=h('form',{class:'login'},
    h('h1',{text:'Rozkład 3I3'}),
    h('p',{text:{in:'Zaloguj się, żeby zobaczyć rozkład i zadania.',up:'Konto założysz tylko na e-mail, który dodał właściciel.',reset:'Wyślemy link do ustawienia nowego hasła.',new:'Ustaw nowe hasło.'}[mode]}),
    mode==='new'?null:em, mode==='reset'?null:pwBox, pwBox2, twice?h('div',{class:'rule',text:'Hasło: minimum '+PW_MIN+' znaków — litery łacińskie, cyfry, spacje i znaki specjalne.'}):null, go, msg,
    mode==='in'?h('button',{class:'lnk',type:'button',onclick:function(){showLogin('up')}},'Nie mam konta — załóż'):null,
    mode==='in'?h('button',{class:'lnk',type:'button',onclick:function(){showLogin('reset')}},'Nie pamiętam hasła'):null,
    mode!=='in'?h('button',{class:'lnk',type:'button',onclick:function(){showLogin('in')}},'Wróć do logowania'):null);
  form.addEventListener('submit',async function(ev){
    ev.preventDefault(); say(''); go.disabled=true;
    var e=em.value.trim().toLowerCase(), p=pw.value;
    if(e) rememberEmail(e);
    if(twice){ var bad=pwProblem(p,pw2.value); if(bad){ say(bad,true); go.disabled=false; return } }
    try{
      var here=location.origin+location.pathname;
      if(mode==='in'){
        var r=await SB.auth.signInWithPassword({email:e,password:p}); if(r.error) throw r.error;
      } else if(mode==='up'){
        var ok=await SB.rpc('can_join',{p_email:e});
        if(ok.error) throw ok.error;
        if(!ok.data){ say('Ten e-mail nie został dodany przez właściciela rozkładu.',true); go.disabled=false; return }
        var u=await SB.auth.signUp({email:e,password:p,options:{emailRedirectTo:here}}); if(u.error) throw u.error;
        if(!u.data.session) say('Prawie gotowe! Otwórz e-mail i kliknij link potwierdzający, potem się zaloguj.');
      } else if(mode==='reset'){
        var rs=await SB.auth.resetPasswordForEmail(e,{redirectTo:here}); if(rs.error) throw rs.error;
        say('Jeśli konto istnieje, link jest już w skrzynce.');
      } else if(mode==='new'){
        var nu=await SB.auth.updateUser({password:p}); if(nu.error) throw nu.error;
        recovering=false; toast('Hasło zmienione'); history.replaceState(null,'',location.pathname); start();
      }
    }catch(err){ say(authMsg(err),true); }
    go.disabled=false;
  });
  $('#app').replaceChildren(form);
  (mode==='new'||(mode==='in'&&em.value)?pw:em).focus();
}
var starting=null;
function start(){ if(!starting) starting=startNow().finally(function(){starting=null}); return starting }
var recovering=/type=recovery/.test(location.hash+location.search);
async function startNow(){
  var s=await SB.auth.getSession(), session=s.data&&s.data.session;
  if(recovering&&session){ showLogin('new'); return }
  if(!session){ showLogin(); return }
  S.user={id:session.user.id,email:(session.user.email||'').toLowerCase()};
  document.body.classList.remove('auth'); applyTheme();
  $('#app').replaceChildren(h('div',{class:'skeleton','aria-label':'Ładowanie rozkładu'}));
  var m=await SB.from('members').select('*').eq('email',S.user.email).maybeSingle();
  if(m.error||!m.data){
    document.body.classList.add('auth'); applyTheme();
    $('#app').replaceChildren(h('div',{class:'login'},h('h1',{text:'Brak dostępu'}),
      h('p',{text:'Konto '+S.user.email+' nie zostało dodane do tego rozkładu. Poproś właściciela, żeby Cię dodał.'}),
      h('button',{class:'btn',type:'button',onclick:function(){SB.auth.signOut()}},'Wyloguj się')));
    return;
  }
  S.role=m.data.role;
  await load();
}

/* ---------- boot ---------- */
applyTheme();
(function(){
  var cfg=window.RZ_CONFIG||{};
  if(!window.supabase||!cfg.url||!cfg.anonKey||/WKLEJ/.test(cfg.url+cfg.anonKey)){
    fail('Brakuje ustawień połączenia (plik config.js)'); return;
  }
  SB=window.supabase.createClient(cfg.url,cfg.anonKey,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
  SB.auth.onAuthStateChange(function(ev){
    if(ev==='PASSWORD_RECOVERY'){ recovering=true; setTimeout(function(){showLogin('new')},0); return }
    if(ev==='SIGNED_OUT'){ setTimeout(function(){showLogin()},0); return }
    if(ev==='SIGNED_IN'&&!S.user){ setTimeout(start,0) }
  });
  start();
  /* refresh what others added when you come back to the app, and every minute while it's open */
  document.addEventListener('visibilitychange',function(){ if(document.visibilityState==='visible'&&S.ready) load() });
  setInterval(function(){ if(document.visibilityState==='visible'&&S.ready&&!dragging) load() },60000);
  if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
})();
